 {t:'p',x:'After the closing brace, a local is gone. Using it there stops the program.'},
 {t:'code',x:'{\n  var b = 2;\n}\nprint b;',out:[],err:true},
 {t:'clox',x:['Globals live in a hash table called vm.globals. GET_GLOBAL looks the name up in it while the program runs.','Locals live on the stack. The compiler works out each slot number before running, so GET_LOCAL needs no search.','That is why locals are faster than globals in clox.']},
 {t:'mistake',x:'A common belief is that a variable made inside braces still exists after them. It does not.',wm:'noscope'},
 {t:'remember',x:['var makes a variable. = changes it.','Globals: in a table, by name, for the whole program. Locals: in stack slots, until the closing brace.','Scope is where a name can be used.']},
 {t:'q',q:'What does this print?',code:'var x = 1;\n{\n  var x = 2;\n}\nprint x;',opts:['1','2','nil','An error'],a:0,why:'The inner x lives only inside the braces. Outside, x is still 1.'}]},
{part:'The language',topic:'dec',id:'dec',t:'Decisions',min:6,b:[
 {t:'intro',learn:['How if and else choose which lines run.','The six comparisons, and and or.','Which values count as true, and how if becomes a jump.'],need:['vars'],words:['condition','jump']},
 {t:'h',x:'if and else'},
 {t:'p',x:'if (condition) runs its block when the condition is true. The else block runs when it is false. Only one of the two ever runs.'},
 {t:'code',x:'var marks = 72;\nif (marks >= 40) {\n  print "Pass";\n} else {\n  print "Try again";\n}',out:['Pass']},
 {t:'h',x:'Questions that give true or false'},
 {t:'table',h:['Operator','Means','Example','Result'],r:[['==','equal','3 == 3','true'],['!=','not equal','3 != 3','false'],['<','less than','2 < 3','true'],['<=','at most','3 <= 3','true'],['>','more than','2 > 3','false'],['>=','at least','72 >= 40','true']]},
 {t:'p',x:'and is true only when both sides are true. or is true when at least one side is true.'},
 {t:'p',x:'Both stop early. If the left side of and is false, the right side is never worked out.'},
 {t:'code',x:'print false and nosuch;\nprint true or nosuch;',out:['false','true']},
 {t:'p',x:'nosuch does not exist, yet there is no error. The machine never looked at it.'},
 {t:'h',x:'What counts as true'},
 {t:'p',x:'In Lox, only false and nil count as false. Every other value counts as true, even 0 and the empty text "".'},
 {t:'code',x:'if (0) print "0 counts as true";\nif ("") print "empty text counts as true";\nif (nil) print "never printed";',out:['0 counts as true','empty text counts as true']},
 {t:'h',x:'Inside the bytecode: jumps'},
 {t:'p',x:'There is no if instruction. The compiler writes JUMP_IF_FALSE: if the top value is false, skip ahead.'},
 {t:'p',x:'At the end of the first block it writes JUMP, which skips over the else block.'},
 {t:'bytes',x:'var marks = 72;\nif (marks >= 40) {\n  print "Pass";\n} else {\n  print "Try again";\n}'},
 {t:'p',x:'There is no >= instruction either. marks >= 40 is written as LESS, then NOT: not less than 40.'},
 {t:'clox',x:['The compiler writes a jump before it knows how far to jump. It leaves a blank and fills it in later. The book calls this backpatching.','A jump distance takes 16 bits, so one jump can skip at most 65,535 bytes of code.']},
 {t:'mistake',x:'Some beginners expect 0 to count as false, as it does in C. In Lox, 0 counts as true.'},
 {t:'remember',x:['if runs one block or the other, never both.','Only false and nil count as false.','if becomes JUMP_IF_FALSE and JUMP in the bytecode.']},
 {t:'q',q:'What does this print?',code:'if (0) {\n  print "yes";\n} else {\n  print "no";\n}',opts:['yes','no','0','Nothing'],a:0,why:'0 is not false and not nil, so it counts as true.'}]},
{part:'The language',topic:'loop',id:'loop',t:'Loops',min:5,b:[
 {t:'intro',learn:['How while and for repeat a block.','The three parts of a for loop.','How a loop becomes a jump back.'],need:['dec'],words:['loop']},
 {t:'h',x:'while'},
 {t:'p',x:'while (condition) repeats its block for as long as the condition is true. It checks the condition before every round.'},
 {t:'code',x:'var n = 1;\nwhile (n <= 3) {\n  print n;\n  n = n + 1;\n}',out:['1','2','3']},
 {t:'p',x:'If the condition is false at the start, the block never runs at all.'},
 {t:'code',x:'var n = 5;\nwhile (n < 3) {\n  print n;\n}\nprint "done";',out:['done']},
 {t:'h',x:'for'},
 {t:'p',x:'A for loop puts the three parts of a loop on one line.'},
 {t:'code',x:'var sum = 0;\nfor (var i = 1; i <= 3; i = i + 1) {\n  sum = sum + i;\n}\nprint sum;',out:['6']},
 {t:'list',x:['var i = 1 runs once, before the first round.','i <= 3 is checked before every round.','i = i + 1 runs after every round.']},
 {t:'p',x:'A for loop is a shorter way to write a while loop. Both become the same kind of bytecode.'},
 {t:'h',x:'Inside the bytecode: a jump back'},
 {t:'p',x:'At the end of the block, the compiler writes LOOP: jump back up to the condition. JUMP_IF_FALSE leaves the loop.'},
 {t:'bytes',x:'var n = 0;\nwhile (n < 2) n = n + 1;'},
 {t:'h',x:'Loops that never end'},
 {t:'p',x:'If the condition never becomes false, the loop never stops. This site stops every program after 6,000 steps.'},
 {t:'p',x:'Real clox has no such limit. It would run until you stopped it.'},
 {t:'clox',x:['clox has no instruction for while or for. LOOP jumps backwards. JUMP and JUMP_IF_FALSE jump forwards.','In a for loop, clox writes the step part before the body in the bytecode, and jumps around it.','The book explains why: the compiler reads the code only once, so it writes the step as soon as it reads it.']},
 {t:'mistake',x:'Some beginners think a loop runs one extra time after its condition becomes false.',wm:'onemore'},
 {t:'remember',x:['while checks before every round. It may run zero times.','for: start once, check before each round, step after each round.','A loop is a jump back, written LOOP.']},
 {t:'q',q:'How many lines does this print?',code:'var i = 0;\nwhile (i < 4) {\n  print i;\n  i = i + 2;\n}',opts:['1','2','3','4'],a:1,why:'It prints 0 and 2. When i becomes 4, the condition is false and the loop stops.'}]},
{part:'The language',topic:'fun',id:'fun',t:'Functions and the call stack',min:7,b:[
 {t:'intro',learn:['How to make a function, call it, and get a value back.','What a window is, and how the call stack grows and shrinks.','Why a function that calls itself needs a stop case.'],need:['loop'],words:['function','parameter','call stack']},
 {t:'p',x:'A function is a named block of code you can run again and again. You make one with fun.'},
 {t:'h',x:'Make and call a function'},
 {t:'code',x:'fun greet(name) {\n  return "Hello, " + name;\n}\nprint greet("Asha");\nprint greet("Ravi");',out:['Hello, Asha','Hello, Ravi']},
 {t:'p',x:'name is a parameter. It is a local variable that gets its value from the call. The first call gives it "Asha".'},
 {t:'p',x:'return hands a value back to the caller and ends the call at once. A function with no return gives back nil.'},
 {t:'h',x:'Each call gets its own window'},
 {t:'p',x:'When a function is called, the machine opens a window for that call. A window is the part of the stack that belongs to one call.'},
 {t:'p',x:'The window holds the parameters and the local variables of that call. Two calls of the same function get two different windows.'},
 {t:'p',x:'When the call returns, its window closes. Its local variables are gone, and the result is put where the call was.'},
 {t:'h',x:'The call stack'},
 {t:'p',x:'Open windows sit on top of each other. Only the top one is working. The ones below wait for it to finish.'},
 {t:'code',x:'fun fact(n) {\n  if (n <= 1) return 1;\n  return n * fact(n - 1);\n}\nprint fact(4);',out:['24']},
 {t:'p',x:'fact(4) calls fact(3), which calls fact(2), which calls fact(1). Each call waits for the one above it.'},
 {t:'see',prog:'fun fact(n) {\n  if (n <= 1) return 1;\n  return n * fact(n - 1);\n}\nprint fact(4);',v:'tower',at:{fr:5},cap:'The deepest moment. Four windows of fact are open, each with its own n. The main program waits at the bottom.'},
 {t:'p',x:'A function that calls itself is recursive. It needs a stop case, here n <= 1, or it calls itself forever.'},
 {t:'p',x:'Real clox allows at most 64 open windows. One more, and it stops with "Stack overflow". This site uses the same limit.'},
 {t:'clox',x:['Each open window is a CallFrame. It holds the running function, its place in the bytecode (ip), and where its window starts on the stack.','Slot 0 of every window holds the function being called. The parameters come next, then the local variables.','So a call copies nothing. The arguments are already on the stack, in the right order. They simply become the new window.']},
 {t:'mistake',x:'A common belief is that a parameter is the same variable as a global with the same name.',wm:'shared'},
 {t:'lesson',id:'fun',x:'Watch the windows open and close.'},
 {t:'remember',x:['Each call opens its own window, with its own parameters and locals.','The windows form the call stack. Only the top one runs.','return hands back a value and closes the window. No return gives nil.']},
 {t:'q',q:'What does this print?',code:'fun f(n) {\n  var x = n * 2;\n  return x;\n}\nvar x = 1;\nprint f(5);\nprint x;',opts:['10, 1','10, 10','1, 1','An error'],a:0,why:'The x inside f lives in the window of the call. The global x is a different variable, so it stays 1.'},
 {t:'q',q:'What does a function return if it has no return statement?',code:'fun f() {}\nprint f();',opts:['0','Nothing is printed','nil','An error'],a:2,why:'Every function gives something back. With no return, it gives nil.'}]},
{part:'The language',topic:'clos',id:'clos',t:'Closures',min:9,b:[
 {t:'intro',learn:['How an inner function keeps using the variables of a function that has ended.','What an upvalue is, and when it is open or closed.','Why two closures can share one variable.'],need:['fun'],words:['closure','upvalue']},
 {t:'p',x:'A function can be made inside another function. The inner function can use the outer function’s variables.'},
 {t:'p',x:'That sounds simple. But the outer function may finish first, and its window closes. So where does its variable go? This page answers that.'},
 {t:'h',x:'A first example'},
 {t:'code',x:'fun makeCounter() {\n  var count = 0;\n  fun next() {\n    count = count + 1;\n    return count;\n  }\n  return next;\n}\nvar a = makeCounter();\nvar b = makeCounter();\nprint a();\nprint a();\nprint b();',out:['1','2','1']},
 {t:'p',x:'makeCounter has already finished when a() runs. Yet count is still alive, and it remembers its value between calls.'},
 {t:'p',x:'Each call to makeCounter makes a new count. So a and b each have their own count. That is why b() prints 1.'},
 {t:'h',x:'The problem: local variables die'},
 {t:'p',x:'count is a local variable of makeCounter. It lives in makeCounter’s window on the stack.'},
 {t:'p',x:'When makeCounter returns, that window is thrown away. If next only knew the stack slot of count, it would point at nothing.'},
 {t:'h',x:'The fix: a bag of upvalues'},
 {t:'p',x:'So every closure carries a bag. Each item in the bag is an upvalue: a link to one outside variable that the function uses.'},
 {t:'p',x:'A function together with its bag is called a closure. Here is the whole story of count, in four steps.'},
 {t:'steps',x:['Before running, the compiler sees that next uses count, which belongs to makeCounter. So it notes count as an upvalue of next.','When the machine makes next, it puts a link to count into next’s bag. count is still on the stack, so the link is open.','Just before makeCounter returns, count is about to leave the stack. The machine moves its value into the bag. The link is now closed.','Later, each call of next reads and changes count in the bag. The stack is no longer involved.']},
 {t:'see',prog:'fun makeCounter() {\n  var count = 0;\n  fun next() {\n    count = count + 1;\n    return count;\n  }\n  return next;\n}\nvar c = makeCounter();\nprint c();\nprint c();',v:'clos',at:{say:'give it a bag'},cap:'Step 2. next is made. Its bag links to count, which is still on the desk inside makeCounter’s window.'},
 {t:'see',prog:'fun makeCounter() {\n  var count = 0;\n  fun next() {\n    count = count + 1;\n    return count;\n  }\n  return next;\n}\nvar c = makeCounter();\nprint c();\nprint c();',v:'clos',at:{say:'Save 2 into count'},cap:'Step 4. makeCounter’s window is gone. count lives on in the bag, and the second call has just made it 2.'},
 {t:'h',x:'The bag holds a link, not a copy'},
 {t:'p',x:'The bag does not take a photo of the value. It links to the variable itself. So the closure always sees the latest value.'},
 {t:'code',x:'fun outer() {\n  var x = "before";\n  fun inner() {\n    print x;\n  }\n  x = "after";\n  return inner;\n}\nouter()();',out:['after']},
 {t:'p',x:'inner was made while x was "before". But x changed before inner ran, so inner prints "after".'},
 {t:'h',x:'Two closures can share one variable'},
 {t:'p',x:'When two inner functions use the same outer variable, they share one link. A change made by one is seen by the other.'},
 {t:'code',x:'var up;\nvar show;\nfun make() {\n  var n = 0;\n  fun inc() {\n    n = n + 1;\n  }\n  fun get() {\n    print n;\n  }\n  up = inc;\n  show = get;\n}\nmake();\nup();\nup();\nshow();',out:['2']},
 {t:'p',x:'inc and get were made in the same call of make, so they share one n. inc changed it twice, and get sees 2.'},
 {t:'h',x:'A trap with loops'},
 {t:'p',x:'In Lox, a for loop has one loop variable for the whole loop. Every function made inside the loop links to that same variable.'},
 {t:'code',x:'var f1;\nvar f2;\nfor (var i = 1; i <= 2; i = i + 1) {\n  fun show() {\n    print i;\n  }\n  if (i == 1) f1 = show;\n  if (i == 2) f2 = show;\n}\nf1();\nf2();',out:['3','3']},
 {t:'p',x:'Both print 3, the value i has when the loop ends. Some languages, like JavaScript with let, make a new i for each round. Lox does not.'},
 {t:'clox',x:['The compiler finds upvalues with a function called resolveUpvalue. For each one, it writes two numbers after the CLOSURE instruction.','The first number says whether the variable is a local of the function just outside. The second says which slot, or which upvalue, to link to.','At run time, each link is an ObjUpvalue in the heap. While open, its location points at the stack slot.','The VM keeps a list of open upvalues, sorted by stack slot. It reuses a matching one before making a new one. That is how two closures share a variable.','Closing copies the value into the upvalue itself, and points location there. CLOSE_UPVALUE does this when a block ends, and RETURN does it for the whole window.']},
 {t:'mistake',x:'Some beginners think the counter starts again from 0 on every call.',wm:'forget'},
 {t:'mistake',x:'Some think the outer variable is gone once the outer function ends.',wm:'gone'},
 {t:'lesson',id:'clos',x:'Watch the bag fill and travel, one step at a time.'},
 {t:'remember',x:['A closure is a function plus a bag of upvalues.','An upvalue is a link to an outside variable. It is open while the variable is on the stack, closed after.','The bag links to variables, not copies, so changes are shared.']},
 {t:'q',q:'What does this print?',code:'fun adder(n) {\n  fun add(x) {\n    return x + n;\n  }\n  return add;\n}\nvar add5 = adder(5);\nprint add5(1);',opts:['6','1','5','An error, because adder has finished'],a:0,why:'add carries n in its bag. n is 5, so add5(1) gives 1 + 5.'},
 {t:'q',q:'What is inside a closure’s bag?',opts:['Copies of every global variable','Links to the outside variables it uses','The whole outer function','The values as they were when it was made'],a:1,why:'The bag holds links (upvalues) to the variables it uses, not copies. So it sees later changes too.'},
 {t:'q',q:'Two counters are made with makeCounter. Do they share one count?',opts:['Yes, they share one count','No, each has its own count','Only the first one counts','Neither one counts'],a:1,why:'Each call to makeCounter makes a new count and a new bag.'}]},
{part:'The language',topic:'cls',id:'cls',t:'Classes and objects',min:9,b:[
 {t:'intro',learn:['How to write a class and make objects from it.','Where fields and methods are kept, and what this means.','How init, inheritance and super work.'],need:['clos'],words:['class','object','field','method','inheritance']},
 {t:'p',x:'A class is a blueprint. An object is a thing made from it. Each object has its own fields, and all of them share the class’s methods.'},
 {t:'h',x:'Make a class, make objects'},
 {t:'code',x:'class Pet {\n  init(name) {\n    this.name = name;\n  }\n  hello() {\n    print "I am " + this.name;\n  }\n}\nvar a = Pet("Tom");\nvar b = Pet("Jerry");\na.hello();\nb.hello();',out:['I am Tom','I am Jerry']},
 {t:'p',x:'Calling the class, as in Pet("Tom"), makes a new, empty object. Then init runs on it, with "Tom" as name.'},
 {t:'p',x:'Inside a method, this means the object the method is working on. In a.hello(), this is a. In b.hello(), this is b.'},
 {t:'see',prog:'class Pet {\n  init(name) {\n    this.name = name;\n  }\n  hello() {\n    print "I am " + this.name;\n  }\n}\nvar a = Pet("Tom");\nvar b = Pet("Jerry");\na.hello();\nb.hello();',v:'cls',part:'objs',cap:'One class, two objects. The methods are stored once, in the class. Each object has its own name field.'},
 {t:'h',x:'Fields belong to each object'},
 {t:'p',x:'A field is a named value inside one object. Each object has its own fields, so Tom’s name and Jerry’s name never mix.'},
 {t:'p',x:'You do not list fields in the class. Setting a field creates it, at any time, even outside the class.'},
 {t:'code',x:'class Pet {}\nvar p = Pet();\np.age = 3;\np.age = p.age + 1;\nprint p.age;',out:['4']},
 {t:'p',x:'Reading a field that was never set is a running mistake. The program stops there.'},
 {t:'code',x:'class Pet {}\nvar p = Pet();\nprint p.age;',out:[],err:true},
 {t:'h',x:'Methods belong to the class'},
 {t:'p',x:'Methods are stored once, in the class. Every object of that class uses the same methods. Only the value of this changes.'},
 {t:'p',x:'When you write a.hello, the machine first looks in a’s fields. If there is no such field, it looks in a’s class.'},
 {t:'p',x:'A method found this way is tied to a. This pair is called a bound method. It remembers what this means, even if you store it in a variable.'},
 {t:'code',x:'class Pet {\n  init(name) {\n    this.name = name;\n  }\n  hello() {\n    print "I am " + this.name;\n  }\n}\nvar tom = Pet("Tom");\nvar f = tom.hello;\nf();\nprint tom;\nprint Pet;\nprint f;',out:['I am Tom','Pet instance','Pet','<fn hello>']},
 {t:'p',x:'f() has no dot, yet it still says Tom. The last three lines show how Lox prints an object, a class and a method.'},
 {t:'h',x:'init, the setup method'},
 {t:'list',x:['init runs by itself, each time an object is made.','The values in Pet("Tom") are passed to init.','init always gives back the new object. You never write return this; yourself.','init may not return any other value. That is a writing mistake, found before the program runs.']},
 {t:'code',x:'class Pet {\n  init(name) {\n    this.name = name;\n    return 1;\n  }\n}',out:[],err:true},
 {t:'h',x:'Inheritance: reuse another class'},
 {t:'p',x:'class Dog < Animal means Dog inherits from Animal. Animal is the superclass. Dog gets all of Animal’s methods.'},
 {t:'p',x:'Dog can also write its own version of a method. Its own version wins. This is called overriding.'},
 {t:'code',x:'class Animal {\n  init(name) {\n    this.name = name;\n  }\n  speak() {\n    print this.name + " makes a sound";\n  }\n}\nclass Dog < Animal {\n  speak() {\n    print this.name + " barks";\n  }\n}\nAnimal("Rex").speak();\nDog("Tom").speak();',out:['Rex makes a sound','Tom barks']},
 {t:'p',x:'Dog has no init of its own, yet Dog("Tom") works. It uses the init it got from Animal.'},
 {t:'p',x:'Inside an override, super.speak() still calls the superclass version. So Dog can add to Animal’s behaviour instead of replacing it.'},
 {t:'code',x:'class Animal {\n  speak() {\n    print "...";\n  }\n}\nclass Dog < Animal {\n  speak() {\n    super.speak();\n    print "Woof";\n  }\n}\nDog().speak();',out:['...','Woof']},
 {t:'clox',x:['A class is an ObjClass: a name and a table of methods. An object is an ObjInstance: a pointer to its class and its own table of fields.','Reading a property checks the fields table first, then the methods table. So a field can hide a method with the same name.','A method found this way becomes an ObjBoundMethod: the object plus the method.','For a.hello(), clox does not make a bound method at all. The INVOKE instruction finds the method and calls it at once, which is faster.','Inheritance copies the superclass’s methods into the subclass when the class is made. The book calls this copy-down. Overrides are added after, so they win.']},
 {t:'mistake',x:'A common belief is that all objects of one class share the same fields.',wm:'sharedf'},
 {t:'lesson',id:'cls',x:'Watch objects being made and methods being called.'},
 {t:'remember',x:['Fields belong to each object. Methods are stored once, in the class.','this is the object before the dot. init runs when an object is made.','A subclass gets its superclass’s methods. Its own version wins.']},
 {t:'q',q:'What does  this  mean inside a method?',opts:['The class','The object the method was called on','The first object ever made','The whole program'],a:1,why:'this is the object before the dot, like a in a.hello().'},
 {t:'q',q:'Where are methods stored?',opts:['A copy in every object','Once, in the class','In a global variable','On the stack'],a:1,why:'Methods live in the class. Objects hold only their fields, and find methods through their class.'},
 {t:'q',q:'What does this print?',code:'class Animal {\n  init(name) {\n    this.name = name;\n  }\n  speak() {\n    print this.name + " makes a sound";\n  }\n}\nclass Dog < Animal {\n  speak() {\n    print this.name + " barks";\n  }\n}\nDog("Tom").speak();',opts:['Tom barks','Tom makes a sound','Both lines','An error, because Dog has no init'],a:0,why:'Dog’s own speak overrides Animal’s. The init comes from Animal, so the name is set.'}]},
{part:'Memory',topic:'mem',id:'mem',t:'Memory: the stack and the heap',min:7,b:[
 {t:'intro',learn:['Which values live on the stack and which live in the heap.','What a reference is, and why var b = a; does not copy an object.','Why joining texts in a loop makes garbage.'],need:['cls'],words:['heap','reference','interning']},
 {t:'p',x:'A running program keeps its values in two places. Small values sit on the stack. Bigger things live in a part of memory called the heap.'},
 {t:'h',x:'Two places for values'},
 {t:'table',h:['','The stack, or pile','The heap'],r:[['What lives there','Numbers, true, false, nil, and references','Texts, functions, closures, classes and objects'],['How long it lives','Until its block or call ends','Until nothing can reach it'],['Who frees it','The machine, by popping','The garbage collector']]},
 {t:'p',x:'A number always has the same small size, so it fits straight into a stack slot. A text can be any length, so it cannot.'},
 {t:'p',x:'So the text is made in the heap. The stack, or a variable, keeps only a reference: a small note saying where the text is.'},
 {t:'see',prog:'var a = "Hello";\nvar b = a + " world";\nprint b;',v:'heap',part:'heap',heap:{cells:16,gc:false},cap:'Each text is an object in the heap. The variables a and b hold only references to them.'},
 {t:'h',x:'A reference is not a copy'},
 {t:'p',x:'Copy a number into another variable, and you get a second number. Changing one does not change the other.'},
 {t:'code',x:'var x = 1;\nvar y = x;\ny = 2;\nprint x;\nprint y;',out:['1','2']},
 {t:'p',x:'An object is different. var b = a; copies only the reference. Now a and b point at the same object.'},
 {t:'code',x:'class Box {}\nvar a = Box();\nvar b = a;\nb.n = 5;\nprint a.n;',out:['5']},
 {t:'p',x:'There is only one Box here. b.n = 5 changed it, so a sees the change too.'},
 {t:'note',x:'A text in Lox can never be changed. Joining two texts always makes a new one. So sharing a text is always safe.'},
 {t:'h',x:'Every join makes a new object'},
 {t:'p',x:'Look at s = s + "a"; inside a loop. Each round makes a new, longer text in the heap.'},
 {t:'p',x:'The old text is still in the heap. But no variable points at it any more, so the program can never use it again.'},
 {t:'p',x:'Such an object is called garbage. If nothing frees it, the heap slowly fills up and the program runs out of memory.'},
 {t:'see',prog:'var s = "";\nfor (var i = 0; i < 6; i = i + 1) {\n  s = s + "a";\n}\nprint s;',v:'heap',part:'heap',heap:{cells:32,gc:false},cap:'After six rounds, only the newest text is in use. The older ones are garbage, but nothing has freed them.'},
 {t:'h',x:'Equal texts are stored once'},
 {t:'p',x:'clox keeps one table of all its texts. Before making a new text, it looks for an equal one in that table.'},
 {t:'p',x:'If it finds one, it uses that instead. This is called interning. Two equal texts are then always the very same object.'},
 {t:'code',x:'print "ab" == "a" + "b";',out:['true']},
 {t:'p',x:'Because of interning, clox checks two texts for equality by checking one address. It never compares them letter by letter.'},
 {t:'clox',x:['A value in clox is a small box called Value. It holds a number, true, false or nil directly.','Anything else is a pointer to an Obj in the heap. The kinds are ObjString, ObjFunction, ObjClosure, ObjUpvalue, ObjClass, ObjInstance, ObjBoundMethod and ObjNative.','Every Obj is also on one linked list, vm.objects. That list lets the garbage collector find every object later.']},

 {t:'lesson',id:'mem',x:'Watch the heap fill up, cell by cell.'},
 {t:'remember',x:['Numbers, true, false and nil sit on the stack. Texts, functions and objects live in the heap.','A variable holds a reference to an object, not the object.','An object nothing points at is garbage.']},

{part:'Memory',topic:'gc',id:'gc',t:'Garbage collection',min:8,b:[
 {t:'intro',learn:['How the collector decides what is garbage.','Mark and sweep, step by step.','When the collector runs, on this site and in clox.'],need:['mem'],words:['garbage','reachable','mark','sweep']},
 {t:'p',x:'Lox has no command to free memory. You never say when you are finished with an object. The garbage collector works that out for you.'},
 {t:'h',x:'The big idea: can the program still reach it?'},
 {t:'p',x:'The collector never asks “is this object garbage?”. It asks “can the program still reach it?”. Everything it cannot reach is garbage.'},
 {t:'p',x:'An object is reachable if you can get to it from a root, by following references. On this site, the roots are:'},
 {t:'list',x:['Every value on the stack, including local variables.','Every global variable.','Every function that is running right now.']},
 {t:'p',x:'An object that can be reached is kept, even if the program never uses it again. The collector cannot see the future.'},
 {t:'note',x:'Age and size do not matter. A big, old object stays if anything still reaches it. A tiny new one goes if nothing does.'},
 {t:'h',x:'Mark and sweep, step by step'},
 {t:'p',x:'Here is the program you watch in this topic. Its loop makes a new text in every round, so garbage builds up fast.'},
 {t:'code',x:'var keep = "";\nvar s = "";\nfor (var i = 0; i < 20; i = i + 1) {\n  s = s + "a";\n  if (i == 2) {\n    keep = s;\n  }\n}\nprint s;\nprint keep;',out:['aaaaaaaaaaaaaaaaaaaa','aaa']},
 {t:'steps',x:['The program asks for space for a new object, but the heap is full. The program pauses.','Mark: start at every root. Mark each object you reach there.','Follow the references inside every marked object, and mark what they lead to. Repeat until nothing new gets marked.','Sweep: walk through every object in the heap. Free each one that is not marked.','Clear the marks. The program goes on, and the new object gets its space.']},
 {t:'see',prog:'var keep = "";\nvar s = "";\nfor (var i = 0; i < 20; i = i + 1) {\n  s = s + "a";\n  if (i == 2) {\n    keep = s;\n  }\n}\nprint s;\nprint keep;',v:'heap',part:'heap',heap:{cells:32,gc:true},at:{ph:'start'},cap:'Step 1. The heap is full. Many old texts are garbage, but they still take cells.'},
 {t:'see',prog:'var keep = "";\nvar s = "";\nfor (var i = 0; i < 20; i = i + 1) {\n  s = s + "a";\n  if (i == 2) {\n    keep = s;\n  }\n}\nprint s;\nprint keep;',v:'heap',part:'heap',heap:{cells:32,gc:true},at:{ph:'mark'},cap:'Mark. Only the texts that a variable can reach are marked: s, and keep, which still holds "aaa".'},
 {t:'see',prog:'var keep = "";\nvar s = "";\nfor (var i = 0; i < 20; i = i + 1) {\n  s = s + "a";\n  if (i == 2) {\n    keep = s;\n  }\n}\nprint s;\nprint keep;',v:'heap',part:'heap',heap:{cells:32,gc:true},at:{ph:'sweep'},cap:'Sweep. Every unmarked text is freed, and its cells are empty again. The loop goes on.'},
 {t:'h',x:'Objects that point at each other'},
 {t:'p',x:'Two objects can point at each other. Here a’s field next leads to b, and b’s field next leads back to a.'},
 {t:'code',x:'class Node {}\nvar a = Node();\nvar b = Node();\na.next = b;\nb.next = a;\na = nil;\nb = nil;\nprint "Nothing can reach them now.";',out:['Nothing can reach them now.']},
 {t:'p',x:'Then both variables are set to nil. Each object is still pointed at, but only by the other one.'},
 {t:'p',x:'No root leads to them, so mark never reaches them, and sweep frees both. Below, a loop has filled the heap afterwards.'},
 {t:'see',prog:'class Node {}\nvar a = Node();\nvar b = Node();\na.next = b;\nb.next = a;\na = nil;\nb = nil;\nvar s = "";\nfor (var i = 0; i < 8; i = i + 1) {\n  s = s + "abc";\n}\nprint s;',v:'heap',part:'heap',heap:{cells:12,gc:true},at:{ph:'sweep'},cap:'The two Node objects, #2 and #3, are freed in the sweep, even though they point at each other.'},
 {t:'p',x:'A simpler idea, counting how many references point at each object, would keep these two forever. Mark and sweep does not have that problem.'},
 {t:'h',x:'When does the collector run?'},
 {t:'p',x:'On this site, the heap is a small row of cells, so you can watch it. The collector runs when a new object does not fit.'},
 {t:'p',x:'Real clox counts bytes instead. It runs the collector once the program has used more than a limit, called nextGC. The first limit is 1 MB.'},
 {t:'p',x:'After each clean-up, clox sets the next limit to twice the memory still in use. So a big program does not collect too often.'},
 {t:'clox',x:['clox marks with three colours. White: not reached yet. Gray: reached, but its references are not followed yet. Black: done.','Gray objects wait on a list called the gray stack. Marking ends when the gray stack is empty. Then every white object is garbage.','clox has more roots than this site shows. Open upvalues and the function being compiled are roots too.','Before the sweep, clox removes white texts from its string table. Otherwise the table would point at freed memory.','This site’s heap shows only the texts a program builds while it runs. In clox, texts written in the code are heap objects too.','The running function keeps those texts alive. And because of interning, joining "" and "a" gives back that same "a", not a new one.']},
 {t:'mistake',x:'Some think an object is freed the moment the program stops using it. It is freed only at the next collection, and only if nothing reaches it.'},
 {t:'lesson',id:'gc',x:'Run the collector yourself, and watch mark and sweep.'},
 {t:'remember',x:['Garbage is any object the program can no longer reach.','Mark: start at the roots and follow every reference. Sweep: free the rest.','Objects that point only at each other are freed too.']},
 {t:'q',q:'When is an object garbage?',opts:['When it is old','When nothing can reach it','When it is big','When the program ends'],a:1,why:'Age and size do not matter. Only whether anything can still reach it.'},
 {t:'q',q:'What does this print?',code:'var a = "x" + "y";\nvar b = a;\na = "z" + "w";\nprint b;',opts:['xy','zw','nil','An error, because "xy" was freed'],a:0,why:'b still holds a reference to "xy", so it is reachable. The collector never frees it.'},
 {t:'q',q:'Two objects point only at each other. No variable reaches them. What does mark and sweep do?',opts:['Keeps both, because each one is pointed at','Frees both at the next collection','Frees one of them','Stops the program'],a:1,why:'Mark starts only from the roots. No root leads to these two, so neither is marked, and sweep frees both.'}]},
{part:'Errors and speed',topic:'err',id:'err',t:'Errors',min:5,b:[
 {t:'intro',learn:['The two kinds of error, and when each one is found.','How to read an error message.','Why one wrongly written line stops the whole program.'],need:['add'],words:['syntax error','runtime error']},
 {t:'h',x:'Two kinds of error'},
 {t:'table',h:['Kind','When it is found','Example'],r:[['Writing mistake, or syntax error','Before anything runs','print 1 +;'],['Running mistake, or runtime error','While the program runs','print 1 + "a";']]},
 {t:'h',x:'Writing mistakes: found before running'},
 {t:'p',x:'The compiler reads the whole program before anything runs. If any line is written wrongly, nothing runs, not even the lines above it.'},
 {t:'code',x:'print "start";\nprint 1 +;',out:[],err:true},
 {t:'p',x:'"start" is never printed. The message names line 2 and says what the compiler expected there: a value.'},
 {t:'h',x:'Running mistakes: found while running'},
 {t:'p',x:'Some lines are written correctly but cannot work, like adding a number to a text. The machine finds out only when it reaches that line.'},
 {t:'code',x:'print "start";\nprint 1 + "a";',out:['start'],err:true},
 {t:'p',x:'Line 1 has already run, so "start" is printed. The machine stops at line 2.'},
 {t:'h',x:'Running mistakes you will meet'},
 {t:'table',h:['Mistake','Example'],r:[['Adding a number and a text','print 1 + "a";'],['Using a variable that does not exist','print nosuch;'],['Calling something that is not a function','var x = 3; x();'],['Giving a function the wrong number of values','f(1, 2); when f takes one'],['Reading a field that was never set','print pet.age;']]},
 {t:'p',x:'Each message starts with the line number. Read that line first, then the words of the message.'},
 {t:'clox',x:['Writing mistakes are reported by errorAt in compiler.c. After one, clox goes into panic mode and skips to the next statement.','That way it can report several writing mistakes in one go, without a flood of follow-on messages.','Running mistakes come from runtimeError in vm.c. It prints the message, then the line of every open call.']},
 {t:'mistake',x:'Many beginners think the computer runs line by line, and finds a writing mistake only when it gets there.',wm:'lines'},
 {t:'remember',x:['Writing mistakes are found before running. Nothing runs.','Running mistakes are found when that line runs. The lines before it have run.','Read the line number first, then the message.']},
 {t:'q',q:'A program has a missing value on line 3. What runs?',opts:['Lines 1 and 2','Nothing','Every line except line 3','Only line 3'],a:1,why:'A writing mistake is found before running, so nothing runs.'}]},
{part:'Errors and speed',topic:'opt',id:'opt',t:'Optimization',min:5,b:[
 {t:'intro',learn:['What an optimizer does, and the one rule it must keep.','Constant folding, and the three other tricks on this site.','What an optimizer cannot work out early.'],need:['byte'],words:['optimizer','constant folding']},
 {t:'h',x:'Same answer, less work'},
 {t:'p',x:'An optimizer rewrites the bytecode before the program runs. Its aim: the same output, with fewer steps.'},
 {t:'p',x:'On this site, a step is one instruction the machine follows. Fewer steps means less work.'},
 {t:'h',x:'Constant folding'},
 {t:'p',x:'2 * 3 is always 6. So the optimizer works it out once, before running, and writes CONSTANT 6 instead.'},
 {t:'code',x:'print 2 * 3 + 1;',out:['7']},
 {t:'bytes',x:'print 2 * 3 + 1;',opt:true},
 {t:'p',x:'Then 6 + 1 is folded too. Four instructions become one. Inside a loop, that saving repeats in every round.'},
 {t:'h',x:'Four tricks on this site'},
 {t:'table',h:['Trick','What it does'],r:[['Constant folding','Works out sums of fixed values, like 2 * 3, before running.'],['Known values','A global that is set once and never changed is replaced by its value.'],['Dead steps','A value that is loaded and then thrown away at once is removed, with both steps.'],['Skipped copy','A function that returns a value already on top of the pile skips copying it.']]},
 {t:'h',x:'What it cannot do early'},
 {t:'p',x:'A variable that changes while the program runs has no fixed value. So only the fixed part, 3 * 4, is folded here.'},
 {t:'code',x:'var x = 5;\nx = x + 1;\nprint x * 2 + 3 * 4;',out:['24']},
 {t:'bytes',x:'var x = 5;\nx = x + 1;\nprint x * 2 + 3 * 4;',opt:true},
 {t:'h',x:'The one rule'},
 {t:'p',x:'An optimizer may change the steps, never the output. This site checks that: it runs both versions and compares what they print.'},
 {t:'clox',x:['clox has no optimizer. It writes bytecode straight from your code. The optimizer on this site is an extra, built for this course.','Real compilers, such as those for C and Java, use constant folding and hundreds of other tricks.']},
 {t:'mistake',x:'Some think an optimizer makes a program give a better answer. The answer must stay exactly the same. Only the work changes.'},
 {t:'remember',x:['An optimizer gives the same output with fewer steps.','Constant folding works out fixed sums before running.','A value that can change cannot be worked out early.']},
 {t:'q',q:'What must an optimizer never change?',opts:['The number of steps','The answer','The bytecode','The speed'],a:1,why:'It may change the steps, but the output must stay exactly the same.'}]},
{part:'Make your own language',id:'build',t:'Build your own language',min:5,b:[
 {t:'p',x:'You now know the parts of a real language. Building your own is the best way to understand them deeply.'},
 {t:'p',x:'Build it in this order. Each step is small, and each one works before you start the next.'},
 {t:'table',h:['Step','What to build','Where this course explains it'],r:[['1. Choose what it is for','A calculator? A game? Rename keywords to get the feel.','Practice, Change the language'],['2. Write a scanner','Cut the text into pieces.','Topic 2: Tokens'],['3. Write a compiler','Turn the pieces into instructions.','Topics 3 and 4: Order of operations, Bytecode'],['4. Write a virtual machine','A loop that runs the instructions.','Topic 5: The machine and the stack'],['5. Add variables','Globals by name, locals by position.','Topic 6: Variables'],['6. Add loops and decisions','They are jumps forward and back.','Topics 7 and 8: Decisions, Loops'],['7. Add functions','Every call opens a window.','Topic 9: Functions'],['8. Add closures','Values that outlive their function.','Topic 10: Closures'],['9. Show clear errors','Mistakes found before and during running.','Topic 14: Errors'],['10. Make it faster','Do work early. Skip useless work.','Topic 15: Optimization']]},
 {t:'p',x:'Test each step before the next one. Small programs with known answers are your best friends.'},
 {t:'note',x:'This site was built the same way. Its engine is tested against clox, the interpreter from the book Crafting Interpreters.'},
 {t:'p',x:'You can already change this language. In Practice, open Change the language, rename a keyword, like print to show, and run your code again.'},
 {t:'q',q:'What is a good first language to build?',opts:['A full copy of Python','A calculator for + - * / and brackets','A web browser','A game engine'],a:1,why:'A calculator already needs a scanner, precedence, bytecode and a stack, but stays small.'}]},
{part:'Make your own language',id:'next',t:'Where to go next',min:3,b:[

// A fixed shuffle from a seed, so a test can be reviewed in the same order it was taken.
function shuf(a,seed){const r=a.slice();let s=seed||1;for(let i=r.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}

<div class="tbx"><b>Coding test</b><span class="dm">${ps.length} problems. Write each one, then Submit to run the hidden checks.</span>${solved?`<span class="tsc${solved===ps.length?' ok':''}">Solved: ${solved} of ${ps.length}</span>`:''}<div class="pl">${ps.map(p=>`<button class="btn${r.code[p.id]?' done':''}" data-prob="${p.id}" type="button">${r.code[p.id]?'✓ ':''}${esc(p.t)}</button>`).join('')}</div></div></div></section>`};

 const show=()=>{const Q=qs[k];$('#main').innerHTML=`<section class="card qt"><div class="qth"><span class="kicker">${esc(unit[1])}: quiz test</span><span class="dm" id="qtime"></span></div>

<div class="ctl tnav"><button class="btn" id="qtb" type="button" ${k?'':'disabled'}>Back</button><button class="btn pri" id="qtn" type="button" ${pick[k]<0?'disabled':''}>${k===qs.length-1?'Finish the test':'Next'}</button></div></section>`;

//   - A change that could not be sent is remembered (acctdirty) and sent again later, even after a reload.
//   - Progress on this device is never thrown away without the learner choosing so.
//   - Logging out clears this device, so the next person on a shared computer starts clean.
// Stored here: acct = {name, token, rev}; acctdirty = '1' while a change still has to be sent; lbcache = last leaderboard.
const SYNCK=/^(lpr2|xp|streak|btm|tests|name|codes2|lex|pre|badges|done2|lastL2|prob:[a-z0-9]{1,24})$/;
const Acc={up:false,busy:false,st:'',choice:null,msg:'',timer:0,wait:5000,applying:false,

// ==== src/ui/shell.js

 if(v==='s')intro();else if(v==='t')tests();else if(v==='u')profile();else if(v==='w')workshop();else if(v==='b')machine(arg);else if(v==='o')about();else if(v==='r')board();else if(v==='a')atlas('f');else if(v==='g')guide(gcur);else if(v==='x'&&typeof present==='function')present();else if(v==='p')chapter(CH.findIndex(c=>c.pg));else chapter(arg!==undefined?arg:lastL);

// ==== src/ui/router.js
// UI. Addresses. Every screen has its own address after the #, so links can be shared and the browser's Back and
// Forward buttons work.   #/  #/topic/<id>/<read|watch|try|check>  #/practice  #/practice?code=<shared code>
// #/machine/<level>  #/language  #/tests  #/reference/<page id>  #/reference/more  #/profile  #/about
// The address is worked out from what is on screen (addr), after any of the functions in ROUTED has run.
const RPH=['read','watch','try','check'];let rFrom=false,rWait=false;
function addr(){const v=document.body.dataset.view;
 if(v==='l'&&CH[ci]&&!CH[ci].pg)return`#/topic/${CH[ci].id}/${RPH[$('.tread')?0:(lp(ci).ph||1)]}`;
 if(v==='p')return'#/practice';if(v==='b')return`#/machine/${BM&&BM.own?'own':(BM?BM.n:0)+1}`;if(v==='w')return'#/language';if(v==='t')return'#/tests';
 if(v==='g')return`#/reference/${REF()[gcur].id}`;if(v==='a')return'#/reference/more';if(v==='u')return'#/profile';if(v==='o')return'#/about';if(v==='r')return'#/leaderboard';if(v==='x')return null;return'#/'}
function syncURL(){if(rWait)return;rWait=true;queueMicrotask(()=>{rWait=false;const a=addr(),from=rFrom;rFrom=false;if(a===null||a===(location.hash||'#/'))return;
 try{history[from||!location.hash?'replaceState':'pushState'](null,'',a)}catch(e){}})}
const enc=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
 dec=s=>{try{return decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))))}catch(e){return null}};
function goRoute(h){rFrom=true;const[path,qs]=(h||'').replace(/^#\/?/,'').split('?'),p=path.split('/');
 switch(p[0]){
  case'topic':{const i=CH.findIndex(c=>c.id===p[1]&&!c.pg);if(i<0){setView('s');break}const ph=Math.max(0,RPH.indexOf(p[2]));document.body.dataset.view='l';setView('l',i);if(($('.tread')?0:lp(i).ph)!==ph)chapter(i,ph);break}
  case'practice':{setView('p');const m=/(?:^|&)code=([\w-]+)/.exec(qs||''),src=m&&dec(m[1]);if(src&&src.length<20000){const cur=$('#src').value;if(cur!==src&&!RC.some(x=>rw(x.p,{},LEX)===cur))codes.own=cur;$('#src').value=src;codes[ci]=src;persist();recompute();if($('#rback'))$('#rback').hidden=!codes.own}break}
  case'machine':setView('b',p[1]==='own'?'own':Math.max(0,(+p[1]||1)-1));break;
  case'language':setView('w');break;case'tests':setView('t');break;case'profile':setView('u');break;case'about':setView('o');break;case'leaderboard':setView('r');break;
  case'reference':{if(p[1]==='more'){setView('a');break}const j=REF().findIndex(g=>g.id===p[1]);if(j>=0)gcur=j;setView('g');break}
  default:setView('s')}
 syncURL()}
