:root{--bg:#F4F7FA;--pn:#fff;--ink:#14263A;--dim:#566B7D;--ln:#C9D4DE;--a:#0B7260;--ab:#DDF3EC;--b:#A65F00;--bb:#FCEBD0;--r:#B8321F;--rb:#FBE1DC;--p:#74348F;--pb:#EEE2F5;--f:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--m:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#122D42;--pn:#173650;--ink:#DCEEF7;--dim:#8FB0C4;--ln:#2E5872;--a:#7BE0C4;--ab:#123F38;--b:#F0B25E;--bb:#3A3220;--r:#F0917A;--rb:#3A2620;--p:#E499CE;--pb:#33223A}
*,*::before,*::after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--f)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;max-width:1120px;margin:0 auto;padding:14px 18px}
.top h1{margin:0;font-size:22px}.top small{color:var(--dim);display:block;font-size:13px}
.wrap{display:grid;grid-template-columns:230px 1fr;gap:22px;max-width:1120px;margin:0 auto;padding:0 18px 40px}
@media(max-width:780px){.wrap{grid-template-columns:1fr}.rail{display:flex;overflow-x:auto;gap:8px}.rail button{flex:0 0 auto}}
.rail{display:flex;flex-direction:column;gap:8px;align-self:start}
.rail button,.btn{font:600 14px var(--f);color:var(--ink);background:var(--pn);border:1.5px solid var(--ln);border-radius:10px;padding:9px 12px;text-align:left;cursor:pointer}
.rail button[aria-current=true]{border-color:var(--a);background:var(--ab)}.rail button:disabled{opacity:.5;cursor:default}
.rail .dn::after{content:" done";color:var(--a);font-weight:700}.rail small{display:block;font-weight:400;color:var(--dim)}
.btn.pri{background:var(--a);border-color:var(--a);color:var(--pn)}.btn:focus-visible,.rail button:focus-visible,textarea:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.card{background:var(--pn);border:1.5px solid var(--ln);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:26px;line-height:1.25}.lead{margin:6px 0 0;max-width:68ch}
textarea{width:100%;min-height:150px;font:15px/1.6 var(--m);color:var(--ink);background:var(--bg);border:1.5px solid var(--ln);border-radius:10px;padding:10px 12px;resize:vertical}
.er{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--rb);color:var(--r);font-weight:600}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.say{min-height:3.4em;font-size:20px;font-weight:600;padding:10px 14px;border-left:5px solid var(--a);background:var(--ab);border-radius:0 10px 10px 0}
.viz{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px}.col{flex:1 1 230px;min-width:0}.col.wide{flex:2 1 360px}
.lb{font:600 12px var(--m);color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}.dm{color:var(--dim)}
.pile,.shelf,.desk{display:flex;gap:8px;min-height:44px}.pile{flex-direction:column-reverse;width:150px;border-bottom:3px solid var(--ink);padding-bottom:6px}.shelf,.desk{flex-wrap:wrap}
.tl{font:600 17px var(--m);background:var(--pb);border:2px solid var(--p);border-radius:8px;padding:4px 12px;text-align:center}
.bx{font:600 17px var(--m);border:2px solid var(--b);background:var(--bb);border-radius:8px;padding:2px 12px}.bx.lc{border-color:var(--a);background:var(--ab)}.bx b{display:block;font:500 12px var(--m);color:var(--dim)}
.nw{animation:pop .4s cubic-bezier(.22,1,.36,1)}@keyframes pop{from{opacity:0;transform:translateY(-14px) scale(.9)}}
.code{font:15px/1.7 var(--m);background:var(--bg);border-radius:10px;padding:6px 0}.code div{white-space:pre;padding:0 12px;border-left:5px solid transparent}.code i{color:var(--dim);font-style:normal;display:inline-block;width:2.2ch;margin-right:10px}.code .hl{background:var(--bb);border-color:var(--b)}
.trail{display:flex;flex-wrap:wrap;gap:4px}.trail span{font:500 13px var(--m);border:1.5px solid var(--ln);border-radius:6px;padding:0 8px}.trail .cur{background:var(--b);color:var(--pn);border-color:var(--b)}
.jmp{margin:8px 0;font-weight:600;color:var(--b)}
ol.ins{margin:0;padding:0;list-style:none;font-size:15px}ol.ins li{padding:2px 10px;border-left:5px solid transparent}ol.ins li.on{background:var(--ab);border-color:var(--a)}ol.ins .op{font:500 11px var(--m);color:var(--dim);margin-right:8px}
.scr{font:16px var(--m);background:#0e1b27;color:#8CF0C8;border-radius:10px;padding:8px 14px;min-height:46px;white-space:pre-wrap}
.task{border:2px dashed var(--b);border-radius:12px;padding:12px 16px;margin-top:14px}.task.ok{border-style:solid;border-color:var(--a);background:var(--ab)}
.aha{margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--pb);border:2px solid var(--p);font-size:18px;animation:pop .5s}
.nav{display:flex;justify-content:space-between;margin-top:14px}
footer{max-width:1120px;margin:0 auto;padding:0 18px 30px;color:var(--dim);font-size:13px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wins{display:flex;flex-direction:column-reverse;gap:6px}.win{border:2px solid var(--b);background:var(--bb);border-radius:8px;padding:6px 12px;font:600 15px var(--m)}.win.top{border-color:var(--a);background:var(--ab)}.win small{display:block;font:400 12px var(--f);color:var(--dim)}
.gate{border:2px solid var(--ln);border-radius:10px;padding:10px 14px;margin-bottom:8px}.gate.ok{border-color:var(--a);background:var(--ab)}.gate.bad{border-color:var(--r);background:var(--rb)}.gate.run{border-color:var(--b);background:var(--bb)}
:root{--scb:#0e1b27;--sct:#8CF0C8;color-scheme:light}:root[data-theme=dark]{color-scheme:dark;--scb:#0A1A28;--sct:#7BE0C4}
:root[data-theme=paper]{--bg:#F1E9D6;--pn:#FBF6E9;--ink:#1C3A52;--dim:#5C7A8C;--ln:#C9BE9E;--a:#2E7D6B;--ab:#DCEEE7;--b:#B5751F;--bb:#F3E2C4;--r:#B5432F;--rb:#F5DED6;--p:#8C3D74;--pb:#EBDCE6;--scb:#1C3A52;--sct:#F3E2C4}
:root[data-theme=paper] body,:root[data-theme=dark] body{background-image:linear-gradient(color-mix(in srgb,var(--ln) 45%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--ln) 45%,transparent) 1px,transparent 1px);background-size:28px 28px}

   case'GET_LOCAL':v=WM==='shared'&&F.f.pn&&F.f.pn.includes(c.nm)?G[c.nm]:st[F.base+c.arg];st.push(v);say=`Copy ${c.nm} (${sh(v)}) from the desk onto the pile.`;break;
   case'SET_LOCAL':v=st[st.length-1];if(WM==='shared'&&F.f.pn&&F.f.pn.includes(c.nm))G[c.nm]=v;else st[F.base+c.arg]=v;say=`Save ${sh(v)} into ${c.nm} on the desk.`;break;
   case'GET_GLOBAL':if(!(c.nm in G)&&(WM==='missnil'||WM==='miss0')){v=WM==='miss0'?0:null;st.push(v);say=`${c.nm} does not exist, so this machine uses ${sh(v)}.`;break}if(!(c.nm in G))throw RE(c,`There is no variable called "${c.nm}" here. Was it made, or did its block end?`);v=G[c.nm];st.push(v);say=`Fetch ${c.nm} (${sh(v)}) from the shelf.`;break;
   case'SET_GLOBAL':if(!(c.nm in G))throw RE(c,`There is no variable called "${c.nm}" here. Was it made, or did its block end?`);v=st[st.length-1];G[c.nm]=v;say=`Save ${sh(v)} into ${c.nm} on the shelf.`;break;
   case'DEFINE_GLOBAL':v=st.pop();G[c.nm]=v;say=`Put ${sh(v)} on the shelf under the name ${c.nm}.`;break;
   case'ADD':{const bb=st[st.length-1],aa=st[st.length-2];
    if(isS(aa)&&isS(bb))v=mkStr(sv(aa)+sv(bb),c);else if(typeof aa==='number'&&typeof bb==='number')v=aa+bb;else if(WM==='join'&&(isS(aa)||isS(bb)))v=mkStr(fv(aa)+fv(bb),c);else throw RE(c,'You can add two numbers or two texts. Not a number and a text.');
    st.pop();st.pop();st.push(v);a=aa;b=bb;say=`${sh(a)} + ${sh(b)} makes ${sh(v)}.`;break}
   case'SUBTRACT':case'MULTIPLY':case'DIVIDE':case'GREATER':case'LESS':b=st.pop();a=st.pop();num(c,a,b);if(WM==='div0'&&o==='DIVIDE'&&b===0)throw RE(c,'You cannot divide by zero.');v=o==='SUBTRACT'?a-b:o==='MULTIPLY'?a*b:o==='DIVIDE'?a/b:o==='GREATER'?a>b:a<b;st.push(v);say=`${sh(a)} ${({SUBTRACT:'-',MULTIPLY:'x',DIVIDE:'/',GREATER:'>',LESS:'<'})[o]} ${sh(b)} gives ${sh(v)}.`;break;
   case'EQUAL':b=st.pop();a=st.pop();v=isS(a)&&isS(b)?sv(a)===sv(b):a===b;st.push(v);say=`Is ${sh(a)} equal to ${sh(b)}? ${v}.`;break;
   case'NOT':v=tf(st.pop());st.push(v);say=`Flip it: now ${v}.`;break;
   case'NEGATE':v=st.pop();num(c,v,0);st.push(-v);say=`Flip the sign: ${-v}.`;break;
   case'PRINT':v=st.pop();out.push(fv(v));say=`Show ${fv(v)} on the screen.`;break;
   case'JUMP_IF_FALSE':v=st[st.length-1];if(tf(v)&&WM==='onemore'&&F.f.code[c.arg-1]&&F.f.code[c.arg-1].op==='LOOP'&&!xtra.has(c)){xtra.add(c);say='False, but this machine runs the loop one more time.'}else if(tf(v)){nx=c.arg;say='False, so skip over the next part.'}else say='True, so carry on.';break;
   case'JUMP':nx=c.arg;say='Skip over the other branch.';break;
   case'LOOP':nx=c.arg;say='Go back up and check again.';break;
   case'CLOSURE':{const pr=K[c.arg],cl={kind:'closure',name:pr.name,arity:pr.arity,pn:pr.pn,code:pr.code,K:pr.K,uv:[]};reg(cl,c);(pr.ups||[]).forEach(u=>cl.uv.push(u.l?cap(F.base+u.i,u.n):F.f.uv[u.i]));cls.push(cl);st.push(cl);
    say=`Create the function ${cl.name}${cl.uv.length?' and give it a bag for '+cl.uv.map(u=>u.n).join(', '):''}.`;break}
   case'GET_UPVALUE':{const u=(F.uvc||F.f.uv)[c.arg];if(WM==='gone'&&!u.open)throw RE(c,`${c.nm} is gone. Its function has ended.`);v=u.open?st[u.slot]:u.val;st.push(v);say=`Read ${c.nm} from the bag: ${sh(v)}.`;break}
   case'SET_UPVALUE':{const u=(F.uvc||F.f.uv)[c.arg];v=st[st.length-1];if(u.open)st[u.slot]=v;else u.val=v;say=`Save ${sh(v)} into ${c.nm} in the bag.`;break}
   case'CLOSE_UPVALUE':closeFrom(st.length-1);st.pop();say=`${c.nm} is about to leave the desk, so it moves into the bag first.`;break;
   case'CLASS':{const kl={kind:'class',id:++oid,name:c.nm,methods:{},sup:null};objs.push(kl);reg(kl,c);st.push(kl);say=`Create the class ${c.nm}. It is a blueprint for objects.`;break}
   case'METHOD':{const m=st.pop(),kl=st[st.length-1];kl.methods[c.nm]=m;say=`Add the method ${c.nm} to the class ${kl.name}.`;break}
   case'INHERIT':{const sp=st[st.length-2],sb=st[st.length-1];if(!sp||sp.kind!=='class')throw RE(c,'A class can only inherit from a class.');Object.assign(sb.methods,sp.methods);sb.sup=sp;st.pop();say=`Copy the methods of ${sp.name} into ${sb.name}.`;break}
   case'GET_PROPERTY':{const ob=st[st.length-1];if(!ob||ob.kind!=='inst')throw RE(c,'Only objects have fields and methods.');
    const FS=WM==='sharedf'?(ob.cls.sf=ob.cls.sf||{}):ob.fields;if(c.nm in FS){v=FS[c.nm];st.pop();st.push(v);say=`Read the field ${c.nm} of the object: ${sh(v)}.`}else if((WM==='missnil'||WM==='miss0')&&!ob.cls.methods[c.nm]){v=WM==='miss0'?0:null;st.pop();st.push(v);say=`There is no field ${c.nm}, so this machine uses ${sh(v)}.`}else{v=bind(ob.cls,c.nm,c,`This object has no field or method called "${c.nm}".`);st.pop();st.push(v);say=`Find the method ${c.nm} and attach it to the object.`}break}
   case'SET_PROPERTY':{v=st.pop();const ob=st[st.length-1];if(!ob||ob.kind!=='inst')throw RE(c,'Only objects have fields.');(WM==='sharedf'?(ob.cls.sf=ob.cls.sf||{}):ob.fields)[c.nm]=v;st.pop();st.push(v);say=`Store ${sh(v)} in the field ${c.nm} of the object.`;break}
   case'INVOKE':{const k=c.argc,rc=st[st.length-1-k];if(!rc||rc.kind!=='inst')throw RE(c,'Only objects have methods.');
    if(c.nm in rc.fields){const f3=rc.fields[c.nm];st[st.length-1-k]=f3;callValue(f3,k,c,F,ip)}else{const m=rc.cls.methods[c.nm];if(!m)throw RE(c,`This object has no method called "${c.nm}".`);openFrame(m,k,c,F,ip)}
    say=`Call the method ${c.nm} on the object. A fresh window opens.`;snap(F,ip,c,say,false);continue}
   case'SUPER_INVOKE':{const k=c.argc,sp=st.pop(),m=sp.methods[c.nm];if(!m)throw RE(c,`The superclass has no method called "${c.nm}".`);openFrame(m,k,c,F,ip);say=`Call ${c.nm} from the superclass ${sp.name}. A fresh window opens.`;snap(F,ip,c,say,false);continue}
   case'GET_SUPER':{const sp=st.pop();v=bind(sp,c.nm,c,`The superclass has no method called "${c.nm}".`);st.pop();st.push(v);say=`Get the method ${c.nm} from the superclass ${sp.name}.`;break}
   case'CALL':{const k=c.arg,f2=st[st.length-1-k],nm0=f2&&f2.kind==='class'?f2.name:null;
    if(callValue(f2,k,c,F,ip)){const fn=fr[fr.length-1].f;say=nm0?`Create a new ${nm0} object and run its init method. A fresh window opens.`:`Call ${fn.name}. A fresh window opens${fn.pn.length?' with its own '+fn.pn.join(', '):''}.`;snap(F,ip,c,say,false);continue}
    say=`Create a new ${nm0} object.`;break}
   case'RETURN':v=st.pop();if(fr.length===1){snap(F,ip,c,'The program is finished.');return{log,out,err:null,G,gcs}}
    const mv=open.filter(u=>u.slot>=F.base).map(u=>u.n);closeFrom(F.base);st.length=F.base;st.push(v);fr.pop();say=`${F.f.name} is done and hands back ${sh(v)}. Its window closes.${mv.length?' '+mv.join(', ')+' moved into the bag.':''}`;break}
  snap(F,ip,c,say,nx!==ip+1);F.ip=nx}}
 catch(e){return{log,out,err:e.lim?e.message:`Line ${e.line}: ${e.message}`,lim:!!e.lim,gcs}}}

// ==== src/engine/optimizer.js
// ENGINE. Optimizer: rewrites bytecode (4 tricks). Must never change a program's output. Pure JS, no DOM.
// Classic script (no modules): files share one global scope and load in the order listed in src/index.html.
function optimize(P){const notes=[],rep={fold:0,known:0,dead:0,copy:0},OPS={ADD:'+',SUBTRACT:'-',MULTIPLY:'x',DIVIDE:'/'},CMP={LESS:'<',GREATER:'>',EQUAL:'=='},defs={},sets={};
 const scanAll=f=>{f.code.forEach(c=>{if(c.op==='DEFINE_GLOBAL')defs[c.nm]=(defs[c.nm]||0)+1;if(c.op==='SET_GLOBAL')sets[c.nm]=1});f.K.forEach(k=>k&&k.code&&scanAll(k))};scanAll(P.f);
 const EF={CONSTANT:1,NIL:1,TRUE:1,FALSE:1,GET_LOCAL:1,GET_GLOBAL:1,GET_UPVALUE:1,CLOSURE:1,POP:-1,CLOSE_UPVALUE:-1,DEFINE_GLOBAL:-1,ADD:-1,SUBTRACT:-1,MULTIPLY:-1,DIVIDE:-1,EQUAL:-1,GREATER:-1,LESS:-1,PRINT:-1};
 const cl=(f,main)=>{const K=f.K.map(k=>k&&k.code?cl(k,false):k),code=f.code.map(c=>({...c}));
  const cut=(i,n,ins)=>{const d=n-ins.length;code.splice(i,n,...ins);code.forEach(c=>{if(/JUMP|LOOP/.test(c.op)&&c.arg>i+n-1)c.arg-=d})};
  for(let ch=1;ch;){ch=0;const tg=new Set(),KN={};code.forEach(c=>{if(/JUMP|LOOP/.test(c.op))tg.add(c.arg)});
   const free=(i,n)=>{for(let j=i+1;j<i+n;j++)if(tg.has(j))return false;return true};
   if(main)code.forEach((c,d)=>{if(c.op==='DEFINE_GLOBAL'&&d>0&&code[d-1].op==='CONSTANT'&&defs[c.nm]===1&&!sets[c.nm])KN[c.nm]={at:d,k:code[d-1].arg}});
   for(let i=0;i<code.length&&!ch;i++){const a=code[i],b=code[i+1],o=code[i+2],x=a.op==='CONSTANT'?K[a.arg]:undefined,y=b&&b.op==='CONSTANT'?K[b.arg]:undefined;
    if(a.op==='GET_GLOBAL'&&KN[a.nm]&&i>KN[a.nm].at){code[i]={...a,op:'CONSTANT',arg:KN[a.nm].k};rep.known++;notes.push(`${a.nm} never changes, so its value ${K[KN[a.nm].k]} was used directly (line ${a.line})`);ch=1}
    else if(x!==undefined&&y!==undefined&&o&&free(i,3)){let r,s;
     if(typeof x==='number'&&typeof y==='number'){if(OPS[o.op]&&!(o.op==='DIVIDE'&&y===0)){r=o.op==='ADD'?x+y:o.op==='SUBTRACT'?x-y:o.op==='MULTIPLY'?x*y:x/y;s=`${x} ${OPS[o.op]} ${y} became ${r}`}else if(CMP[o.op]){r=o.op==='LESS'?x<y:o.op==='GREATER'?x>y:x===y;s=`${x} ${CMP[o.op]} ${y} became ${r}`}}
     else if(typeof x==='string'&&typeof y==='string'&&o.op==='ADD'){r=x+y;s='two pieces of text were joined ahead of time'}
     if(s){rep.fold++;notes.push(`${s} (line ${o.line})`);cut(i,3,[typeof r==='boolean'?{...o,op:r?'TRUE':'FALSE',arg:undefined}:{...a,arg:K.push(r)-1}]);ch=1}}
    else if(typeof x==='number'&&b&&b.op==='NEGATE'&&free(i,2)){rep.fold++;notes.push(`-${x} was worked out ahead of time (line ${b.line})`);cut(i,2,[{...a,arg:K.push(-x)-1}]);ch=1}
    else if((a.op==='TRUE'||a.op==='FALSE')&&b&&b.op==='NOT'&&free(i,2)){rep.fold++;notes.push(`not ${a.op.toLowerCase()} was worked out ahead of time (line ${b.line})`);cut(i,2,[{...a,op:a.op==='TRUE'?'FALSE':'TRUE'}]);ch=1}
    else if(/^(CONSTANT|NIL|TRUE|FALSE|GET_LOCAL)$/.test(a.op)&&b&&b.op==='POP'&&free(i,2)){rep.dead++;notes.push(`a value was loaded and immediately thrown away, so both steps were removed (line ${a.line})`);cut(i,2,[]);ch=1}}
   if(!ch&&!main&&!code.some(c=>/JUMP|LOOP|^(CLASS|METHOD|INHERIT|GET_PROPERTY|SET_PROPERTY|INVOKE|SUPER_INVOKE|GET_SUPER)$/.test(c.op))){let h=1+f.arity;for(let i=0;i<code.length-1;i++){const c=code[i];
    if(c.op==='GET_LOCAL'&&code[i+1].op==='RETURN'&&h===c.arg+1){rep.copy++;notes.push(`${c.nm} was already on top of the pile, so copying it before returning was skipped (line ${c.line})`);cut(i,1,[]);ch=1;break}
    h+=EF[c.op]!==undefined?EF[c.op]:c.op==='CALL'?-c.arg:0}}}
  return{...f,code,K}};
 return{f:cl(P.f,true),T:P.T,notes,rep}}

// ==== src/content/lessons.js
// CONTENT. The lessons: question, starter code, intro text, task, check, aha line. Add a lesson here.
// Classic script (no modules): files share one global scope and load in the order listed in src/index.html.
// The course: 15 topics in 5 parts. Each topic is Read (a GUIDE page with topic:id), then Watch, Try and Check (its cards).
const PARTS=[['Start','Your first program, and the kinds of value.',['first']],
 ['Inside the compiler and the machine','How your text becomes instructions, and how a machine runs them.',['tok','prec','byte','add']],
 ['The language','Variables, decisions, loops, functions, closures and classes.',['vars','dec','loop','fun','clos','cls']],
 ['Memory','Where values live, and how unused memory is freed.',['mem','gc']],
 ['Errors and speed','Two kinds of mistake, and how to do less work.',['err','opt']]];
const CH=[
{id:'first',n:'Your first program',q:'What happens when you press Run?',p:'print "Hello";',v:'pile',lead:'Write one line, press Run, and see what the computer does with it.',task:'Make it print your own name.',ok:r=>!r.err&&r.out.length===1&&r.out[0]!=='Hello',aha:'A program is a list of orders. The computer follows them exactly.'},
{id:'tok',n:'Tokens',q:'How does the computer read your code?',p:'var total = 10 + 25;\nprint total; // show it',v:'tok',lead:'The scanner cuts your code into small pieces called tokens. Spaces and comments are skipped.',task:'Make the program print 50 by changing one token.',ok:r=>!r.err&&r.out.join()==='50',aha:'Change one token and the meaning changes. The scanner only sees tokens, never spaces.'},
{id:'prec',n:'Order of operations',q:'Why does 2 + 3 * 4 give 14?',p:'print 2 + 3 * 4;',v:'pile',lead:'Times comes before plus. The compiler writes the instructions in that order.',task:'Add brackets so the program prints 20.',ok:r=>!r.err&&r.out.join()==='20',aha:'Brackets change which instruction the compiler writes first.'},
{id:'byte',n:'Bytecode',q:'What does the compiler make?',p:'print 4 + 5;\nprint 6;',v:'pile',lead:'The compiler writes a list of tiny instructions, called bytecode. The machine follows that list.',task:'Add a third line, print 10; and watch the list grow.',ok:r=>!r.err&&r.out.join()==='9,6,10',aha:'Each line becomes a few instructions. The values always come before the job.'},
{id:'add',n:'The machine and the stack',q:'How does the machine follow the instructions?',p:'print 1 + 2;',v:'pile',lead:'The computer turns your line into small steps. It keeps values on a pile (called the stack). Press Run and watch.',task:'Change the code so it prints 14.',ok:r=>!r.err&&r.out.join()==='14',aha:'Every program is small steps like these: put values on the pile, work on them, show the answer.'},
{id:'vars',n:'Variables',q:'Where is a variable kept?',p:'var a = 10;\n{\n  var b = a * 2;\n  print b - 5;\n}\nprint a;',v:'mem',lead:'A variable is a box with a name. Boxes made inside { } are thrown away at the closing }.',task:'Add the line  print b;  at the end and run it. What do you see?',ok:r=>/"b"/.test(r.err||''),aha:'b was only inside the { }. After the }, it is gone. This is called scope.'},
{id:'dec',n:'Decisions',q:'How does a program choose?',p:'var marks = 72;\nif (marks >= 40) {\n  print "Pass";\n} else {\n  print "Try again";\n}',v:'flow',lead:'An if asks a question. The answer, true or false, decides which lines run.',task:'Change marks so the program prints Try again.',ok:r=>!r.err&&r.out.join()==='Try again',aha:'The computer never runs both branches. A jump skips the one it does not need.'},
{id:'loop',n:'Loops',q:'How does a program repeat?',p:'var sum = 0;\nfor (var i = 1; i <= 3; i = i + 1) {\n  sum = sum + i;\n}\nprint sum;',v:'flow',lead:'A loop is a jump back up. The machine repeats the lines in between until the condition is false.',task:'Make it add the numbers 1 to 10. The answer is 55.',ok:r=>!r.err&&r.out.join()==='55',aha:'A loop just says "go back up". It stops when the condition becomes false.'},
{id:'fun',n:'Functions',q:'What happens when a function calls itself?',p:'fun fact(n) {\n  if (n <= 1) return 1;\n  return n * fact(n - 1);\n}\nprint fact(4);',v:'tower',lead:'Each call gets its own window with its own values. A function that calls itself opens window after window.',task:'Make it print the factorial of 5. The answer is 120.',ok:r=>!r.err&&r.out.join()==='120',aha:'Each call has its own n. The windows wait for each other. Then the answers come back one by one. This is the call stack.'},
{id:'clos',n:'Closures',q:'How can a function remember a value?',p:'fun makeCounter() {\n  var i = 0;\n  fun count() {\n    i = i + 1;\n    return i;\n  }\n  return count;\n}\nvar c = makeCounter();\nprint c();\nprint c();',v:'clos',lead:'An inner function keeps links to the outer variables it uses. Here they are drawn as a bag that goes wherever the function goes.',task:'Add  var d = makeCounter();  and  print d();  at the end. Does d start at 1, or go on from 3?',ok:r=>!r.err&&r.out.join()==='1,2,1',aha:'Each makeCounter() call makes a new bag. So c and d count separately.'},
{id:'cls',n:'Classes',q:'How does an object get its methods?',p:'class Animal {\n  init(name) {\n    this.name = name;\n  }\n  speak() {\n    print this.name + " makes a sound";\n  }\n}\nvar a = Animal("Rex");\nvar b = Animal("Tom");\na.speak();\nb.speak();',v:'cls',lead:'A class is a blueprint. Each object made from it has its own values (called fields). All objects share the same methods.',task:'Add the line a.name = "Max"; before a.speak(); and run it. Which animal changed its name?',ok:r=>!r.err&&r.out.includes('Max makes a sound')&&r.out.includes('Tom makes a sound'),aha:'The class is made once. Each Animal(...) call makes a new object with its own fields. Changing a field of one object does not change the others.'},{id:'mem',n:'The stack and the heap',q:'Where do objects live while the program runs?',p:'var s = "";\nfor (var i = 0; i < 5; i = i + 1) {\n  s = s + "a";\n}\nprint s;',v:'heap',heap:{cells:32,gc:false},lead:'Numbers sit on the stack. Text and objects live in the heap. Each new string takes space there.',task:'Change 5 to 20 and run it. Watch the unused strings pile up. What happens when the heap is full?',ok:r=>/Out of memory/.test(r.err||''),aha:'Each s = s + "a" makes a new string and leaves the old one behind. Nothing frees the old ones, so unused strings pile up until the heap is full.'},
{id:'gc',n:'Garbage collection',q:'How does the computer free memory nobody needs?',p:'var keep = "";\nvar s = "";\nfor (var i = 0; i < 20; i = i + 1) {\n  s = s + "a";\n  if (i == 2) {\n    keep = s;\n  }\n}\nprint s;\nprint keep;',v:'heap',heap:{cells:32,gc:true},lead:'This is the program from the previous topic, with one change: the program keeps one old string in a variable called keep. A garbage collector now runs when the heap is full. It frees objects the program can no longer reach.',task:'Change i == 2 to i == 10 and run it. Which string does the collector keep now? Check the Held by lines.',ok:r=>!r.err&&r.gcs>0&&r.out[0]==='a'.repeat(20)&&r.out[1]==='a'.repeat(11),aha:'The collector does not care how old an object is. It keeps every object a variable can still reach, such as keep, and frees the rest.'},
{id:'err',n:'Errors',q:'What happens when there is a mistake?',p:'var x = 1;\nprint x + "a";',v:'err',lead:'Writing mistakes are found before the program starts. Running mistakes are found only while it runs. Delete the ; to see the first kind.',task:'Fix the code so it prints 2.',ok:r=>!r.err&&r.out.join()==='2',aha:'A missing ; is found before running. Adding a number and a text is found only while running.'},
{id:'opt',n:'Optimization',q:'Can the same work be done in fewer steps?',p:'var total = 0;\nfor (var i = 0; i < 60; i = i + 1) {\n  total = total + 2 * 3 * 4 + 5 * 6;\n}\nprint total;',v:'opt',lead:'This loop calculates 2 * 3 * 4 + 5 * 6 sixty times. The answer never changes. An optimizer calculates it once, before the program runs.',task:'Turn the optimizer on. Watch the steps go down.',ok:()=>!!(opt&&OP&&OP.r1.log.length<OP.r0.log.length&&OP.r1.out.join()===OP.r0.out.join()),aha:'Same answer, less work. Real compilers do this and much more.'},

// Page types: idea (short text + a picture made by the real engine), play (run the code), quiz (questions with pictures),
// try (the task), deep (compiler and instructions), recap (key points). A lesson without pages keeps the single-page layout.
// tests/engine/pages-content.js checks the structure, the 22-word rule and every answer against the engine and real clox.
const PG={};
// Lessons written as cards: LC[lesson id] = [cards]. See src/ui/cards.js for every card type.
const LC={};
// Which step of a run does a picture show? 'end' (default), a number, or the first step where: {say:'text'} {st:n} {fr:n} {inst:n} {ph:'mark'} {gcs:n}.
// Returns -1 when no step matches. The browser and the tests use this same function.
function pickStep(R,a){const L=R.log,n=L.length-1;if(n<0)return -1;if(a===undefined||a==='end')return n;if(typeof a==='number')return Math.min(Math.max(a,0),n);
 const f=e=>a.say!==undefined?e.say.includes(a.say):a.inst?!!(e.obs&&e.obs.filter(o=>o.k==='inst').length>=a.inst):a.ph?!!(e.hp&&e.hp.ph===a.ph):a.st?e.st.length>=a.st:a.fr?!!(e.fr&&e.fr.length>=a.fr):a.gcs?!!(e.hp&&e.hp.gcs>=a.gcs):false;
 return L.findIndex(f)}

PG.loop=[
 {id:'idea',nav:'Idea',type:'idea',title:'Repeating means jumping',
  body:['A loop repeats some code. The computer does not really repeat anything.','It jumps back to an earlier instruction and runs it again.','A jump forward skips code. A jump back repeats code.'],
  see:{prog:LOOP,v:'flow',at:{say:'Go back up'},cap:'The machine jumps back up to check the loop condition again.'}},
 {id:'watch',nav:'Watch',type:'play',title:'Watch it run',look:'Press Run. Find where the machine goes back up. Count how many times it goes back.',predict:{q:'What will appear on the screen?',opts:['6','3','1 2 3','10'],a:0,out:['6'],why:'The loop adds 1, then 2, then 3 to sum. That makes 6.'}},
 {id:'parts',nav:'Three parts',type:'idea',title:'A loop has three parts',
  body:['A for loop says where to start, when to keep going, and what to change each round.','Before every round the machine checks "keep going?". If the answer is no, it jumps forward, past the loop.','Here the machine adds i to sum each round. That is why the program prints 6.'],
  see:{prog:LOOP,v:'flow',at:{say:'Flip it: now true'},cap:'The check says "keep going". The body will run once more.'}},
 {id:'check',nav:'Check',type:'quiz',title:'Check what you learned',qs:[

// CONTENT. Lesson 4 pages: Functions.
{
const FACT='fun fact(n) {\n  if (n <= 1) return 1;\n  return n * fact(n - 1);\n}\nprint fact(4);';
PG.fun=[
 {id:'idea',nav:'Idea',type:'idea',title:'A call opens a new window',
  body:['When you call a function, the machine opens a fresh window (called a call frame) for it.','The window has its own copies of the values, such as n. Other windows cannot change them.','When the function returns, its window closes and the answer goes back to the caller.'],
  see:{prog:FACT,v:'tower',at:{fr:2},cap:'Calling fact opened a second window. It has its own n.'}},
 {id:'watch',nav:'Watch',type:'play',title:'Watch it run',look:'Press Run. Each call to fact opens a new window on the left. Then watch them close.',predict:{q:'What will appear on the screen?',opts:['10','4','24','1'],a:2,out:['24'],why:'fact(4) is 4 * 3 * 2 * 1, which is 24.'}},
 {id:'rec',nav:'Recursion',type:'idea',title:'A function can call itself',
  body:['A function can call itself. This is called recursion.','Each call gets its own window with its own n. So fact(4) waits for fact(3), which waits for fact(2).','It stops when n is 1. That case is called the base case. Without it, the windows would never stop.'],
  see:{prog:FACT,v:'tower',at:{fr:5},cap:'Four calls are waiting. The newest window is on top.'}},
 {id:'check',nav:'Check',type:'quiz',title:'Check what you learned',qs:[
  {id:'l4-fact',q:'What does this program print?',code:'fun fact(n) {\n  if (n <= 1) return 1;\n  return n * fact(n - 1);\n}\nprint fact(3);',opts:['3','6','9','1'],a:1,out:['6'],why:'fact(3) is 3 * fact(2). fact(2) is 2 * fact(1). fact(1) is 1. So the answer is 3 * 2 * 1, which is 6.',see:{prog:'fun fact(n) {\n  if (n <= 1) return 1;\n  return n * fact(n - 1);\n}\nprint fact(3);',v:'tower',at:{fr:4}}},
  {id:'l4-twice',q:'What does this program print?',code:'fun double(x) {\n  return x * 2;\n}\nprint double(double(3));',opts:['6','9','12','5'],a:2,out:['12'],why:'The inner call gives 6. The outer call doubles that to 12. Each call has its own window.',see:{prog:'fun double(x) {\n  return x * 2;\n}\nprint double(double(3));',v:'tower',at:{fr:2}}},
  {id:'l4-private',q:'What does this program print?',code:'fun f(n) {\n  n = n + 1;\n  return n;\n}\nvar n = 10;\nprint f(5);\nprint n;',opts:['6 then 6','11 then 10','6 then 11','6 then 10'],a:3,out:['6','10'],why:'The n inside f is a copy in its own window. Changing it does not change the n outside.',see:{prog:'fun f(n) {\n  n = n + 1;\n  return n;\n}\nvar n = 10;\nprint f(5);\nprint n;',v:'tower',at:{fr:2}}},
  {id:'l4-base',q:'What happens when this program runs?',code:'fun count(n) {\n  count(n + 1);\n}\ncount(1);',opts:['It stops with an error: too many windows are open','It prints 1','It runs for ever','It prints nothing and ends normally'],a:0,err:'many',clox:'Stack overflow',why:'There is no base case. Each call opens another window, until 64 windows are open. Then the machine stops with an error.',see:{prog:'fun count(n) {\n  count(n + 1);\n}\ncount(1);',v:'tower',at:{fr:12}}}]},
 {id:'try',nav:'Try',type:'try',title:'Try it yourself'},
 {id:'deep',nav:'Under the hood',type:'deep',title:'Under the hood',intro:'For the curious. This page shows how the compiler and the machine do it, step by step.'},
 {id:'recap',nav:'Recap',type:'recap',title:'What you can do now',can:['Explain what a call frame (window) is.','Say what a base case is and why recursion needs one.','Follow a recursive function by hand.']}
];

// ==== src/content/lessons/l05.js

{
const COUNTER='fun makeCounter() {\n  var i = 0;\n  fun count() {\n    i = i + 1;\n    return i;\n  }\n  return count;\n}\n';
PG.clos=[
 {id:'idea',nav:'Idea',type:'idea',title:'A function can remember a value',
  body:['Normally, when a function ends, its window closes and its values are gone.','But sometimes an inner function still needs one of those values later.','Then the machine moves the value into a small bag (called an upvalue). The inner function carries the bag with it.'],
  see:{prog:COUNTER+'var c = makeCounter();\nprint c();\nprint c();',v:'clos',at:{say:'Create the function count'},cap:'The function count is created with a bag for i.'}},
 {id:'watch',nav:'Watch',type:'play',title:'Watch it run',look:'Press Run. Watch i move into the bag when makeCounter closes. Then watch count change it.',predict:{q:'What will appear on the screen?',opts:['1 then 1','1 then 2','2 then 2','0 then 1'],a:1,out:['1','2'],why:'The bag keeps i between calls. The first call makes it 1. The second call makes it 2.'}},
 {id:'own',nav:'Own bags',type:'idea',title:'Every call makes its own bag',
  body:['Each call to makeCounter makes a new i and a new bag.','So two counters do not share a number. Each one counts on its own.','A function together with the bag it carries is called a closure.'],
  see:{prog:COUNTER+'var a = makeCounter();\nvar b = makeCounter();\nprint a();\nprint a();\nprint b();',v:'clos',at:'end',cap:'Two counters, two bags. Counter a counted twice. Counter b counted once.'}},
 {id:'check',nav:'Check',type:'quiz',title:'Check what you learned',qs:[
  {id:'l5-two',q:'What does this program print?',code:COUNTER+'var a = makeCounter();\nvar b = makeCounter();\nprint a();\nprint a();\nprint b();',opts:['1 then 2 then 3','1 then 2 then 1','1 then 1 then 1','1 then 2 then 2'],a:1,out:['1','2','1'],why:'Each counter has its own bag. Counter a goes 1, 2. Counter b starts again at 1.',see:{prog:COUNTER+'var a = makeCounter();\nvar b = makeCounter();\nprint a();\nprint a();\nprint b();',v:'clos',at:'end'}},
  {id:'l5-add',q:'What does this program print?',code:'fun make() {\n  var n = 0;\n  fun add() {\n    n = n + 10;\n    return n;\n  }\n  return add;\n}\nvar f = make();\nprint f();\nprint f();',opts:['20 then 20','10 then 10','0 then 10','10 then 20'],a:3,out:['10','20'],why:'The bag keeps n between calls. The first call makes it 10. The second call starts from 10 and makes it 20.',see:{prog:'fun make() {\n  var n = 0;\n  fun add() {\n    n = n + 10;\n    return n;\n  }\n  return add;\n}\nvar f = make();\nprint f();\nprint f();',v:'clos',at:'end'}},
  {id:'l5-bag',q:'When makeCounter ends, what happens to its variable i?',opts:['It moves into a bag that count carries','It is thrown away','It moves to the shelf','It is copied into every function'],a:0,why:'The machine sees that count still needs i. So just before the window closes, i moves into the bag.',see:{prog:COUNTER+'var c = makeCounter();\nprint c();',v:'clos',at:{say:'Its window closes'},expect:{say:'moved into the bag'}}},
  {id:'l5-kept',q:'What does this program print?',code:'fun outer() {\n  var x = "kept";\n  fun inner() {\n    print x;\n  }\n  return inner;\n}\nouter()();',opts:['It stops with an error: x is gone','nil','kept','outer'],a:2,out:['kept'],why:'The function inner carries x in a bag. So x is still there when inner runs, after outer has ended.',see:{prog:'fun outer() {\n  var x = "kept";\n  fun inner() {\n    print x;\n  }\n  return inner;\n}\nouter()();',v:'clos',at:'end'}}]},
 {id:'try',nav:'Try',type:'try',title:'Try it yourself'},
 {id:'deep',nav:'Under the hood',type:'deep',title:'Under the hood',intro:'For the curious. This page shows how the compiler and the machine do it, step by step.'},

 {id:'idea',nav:'Idea',type:'idea',title:'Some things need more room',
  body:['A number is small and always the same size. It fits right on the pile.','Text can be any length. It can also live longer than the code that made it.','So text goes in a bigger place called the heap. The pile only keeps a reference (a way to find it).'],
  see:{prog:'var s = "hello" + " world";',v:'heap',part:'heap',heap:H32,at:'end',cap:'The text takes space in the heap. The variable s holds a reference to it.',expect:{heap:{made:1,inuse:1,unused:0}}}},
 {id:'watch',nav:'Watch',type:'play',title:'Watch it run',look:'Press Run. Watch the heap fill up. Read the counters: made, in use and unused.',predict:{q:'The loop makes 5 strings. How many will be unused at the end?',opts:['0','1','4','5'],a:2,proves:{heaps:[{prog:CH.find(c=>c.id==='mem').p,made:5,inuse:1,unused:4}]},why:'Only the last string is held by s. The other four are left behind.'}},
 {id:'left',nav:'Left behind',type:'idea',title:'Old strings are left behind',
  body:['The line s = s + "a" does not change the old string. It makes a new one.','The variable s now points to the new string. The old one is still in the heap, but nothing uses it.','Nothing frees it yet. So unused strings pile up.'],
  see:{prog:GROW,v:'heap',part:'heap',heap:H32,at:'end',cap:'Five strings were made. Only one is in use. Four are unused.',expect:{heap:{made:5,inuse:1,unused:4}}}},
 {id:'check',nav:'Check',type:'quiz',title:'Check what you learned',qs:[

  {id:'l7-count',q:'This program builds a string 4 times. How many of those strings are unused at the end?',code:'var s = "";\nfor (var i = 0; i < 4; i = i + 1) {\n  s = s + "a";\n}',opts:['0','1','3','4'],a:2,proves:{heaps:[{prog:'var s = "";\nfor (var i = 0; i < 4; i = i + 1) {\n  s = s + "a";\n}',made:4,inuse:1,unused:3}]},why:'Four strings were made. Only the last one is held by s. The other three are unused.',see:{prog:'var s = "";\nfor (var i = 0; i < 4; i = i + 1) {\n  s = s + "a";\n}',v:'heap',part:'heap',heap:H32,at:'end'}},

// CONTENT. Lesson 10 pages: Optimization.
{
const OPT='var total = 0;\nfor (var i = 0; i < 60; i = i + 1) {\n  total = total + 2 * 3 * 4 + 5 * 6;\n}\nprint total;';
PG.opt=[
 {id:'idea',nav:'Idea',type:'idea',title:'The same answer in fewer steps',
  body:['The compiler can often find a shorter list of instructions that gives the same answer.','For example, 2 * 3 * 4 is always 24. The compiler can work it out once, before the program runs.','This is called constant folding. It makes a program faster without changing what it prints.'],
  see:{prog:OPT,v:'opt',at:'end',cap:'Compare the two bars. The optimizer gets the same answer in fewer steps.',expect:{opt:{same:true,fewer:true}}}},
 {id:'watch',nav:'Watch',type:'play',title:'Watch it run',look:'Turn the optimizer on. Press Run again. Compare the steps before and after.',predict:{q:'With the optimizer on, will the answer change?',opts:['Yes, smaller','No, only the steps','Yes, it is 0','Nothing happens'],a:1,proves:{opt:{prog:CH.find(c=>c.id==='opt').p,same:true,fewer:true}},why:'An optimization must never change the answer. It only removes work.'}},
 {id:'safe',nav:'Staying safe',type:'idea',title:'It must never change the answer',
  body:['A trick is safe only if the program prints exactly the same thing.','Each trick is a pattern and a safe replacement. Example: if both numbers are known, calculate the answer now.','This site checks it. The optimized program must print the same as the original.'],
  see:{prog:OPT,v:'opt',on:true,at:'end',cap:'The same program with the optimizer on. It does fewer steps and prints the same answer.',expect:{opt:{same:true,fewer:true}}}},
 {id:'check',nav:'Check',type:'quiz',title:'Check what you learned',qs:[
  {id:'l10-fold',q:'What does the optimizer do with 2 * 3 * 4?',opts:['It works out 24 before the program runs','It deletes the line','It prints 234','It leaves everything as it is'],a:0,proves:{opt:{prog:'print 2 * 3 * 4;',noops:['MULTIPLY'],consts:[24]}},why:'The three numbers are known, so the answer is always 24. The optimizer puts 24 in the program, and the multiplying instructions are gone.',see:{prog:'print 2 * 3 * 4;',v:'opt',on:true,at:'end'}},
  {id:'l10-same',q:'What does this program print with the optimizer on?',code:'var t = 0;\nfor (var i = 0; i < 5; i = i + 1) {\n  t = t + 2 * 3;\n}\nprint t;',opts:['6','30','36','Nothing, the loop is removed'],a:1,out:['30'],proves:{opt:{prog:'var t = 0;\nfor (var i = 0; i < 5; i = i + 1) {\n  t = t + 2 * 3;\n}\nprint t;',same:true,fewer:true}},why:'The answer is the same with the optimizer off or on. Optimizing changes how the work is done, never the result.',see:{prog:'var t = 0;\nfor (var i = 0; i < 5; i = i + 1) {\n  t = t + 2 * 3;\n}\nprint t;',v:'opt',on:true,at:'end'}},

  {id:'l10-sum',q:'What does this program print?',code:'print 1 + 2 * 3 - 4;',opts:['9','5','1','3'],a:3,out:['3'],why:'The times runs first: 2 * 3 is 6. Then 1 + 6 is 7. Then 7 - 4 is 3.',see:{prog:'print 1 + 2 * 3 - 4;',v:'opt',on:true,at:'end'}}]},
 {id:'try',nav:'Try',type:'try',title:'Try it yourself'},

];

 {t:'moment',h:'Then the plus',at:{say:'makes 14'},x:'Now ADD takes 2 and 12 off the pile and puts back 14.',do:'Press Next once more.'},

// ==== src/store/store.js
// STORE. The one place where progress is saved and loaded. Nothing else in the code touches browser storage.
// Today the backend is the browser (localStorage). A server backend can be plugged in later with Store.use(backend):
// it must offer get(key) -> string|null and set(key, string). See docs/BACKEND.md.
// Store.event(type, data) keeps a short log of what the learner did (card done, answer, test). A server can replay it.
const Store=(()=>{
 const local={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}},keys:()=>{try{return Object.keys(localStorage)}catch(e){return[]}}};
 let B=local;const subs=[];
 const raw=k=>B.get(k),put=(k,v)=>{B.set(k,String(v));subs.forEach(f=>{try{f('set',k)}catch(e){}})};
 const get=(k,d)=>{const v=raw(k);if(v==null)return d;try{return JSON.parse(v)}catch(e){return d}},set=(k,v)=>put(k,JSON.stringify(v));
 function event(type,data){const L=get('events',[]);L.push({t:Date.now(),type,...(data||{})});if(L.length>2000)L.splice(0,L.length-2000);set('events',L);subs.forEach(f=>{try{f('event',type,data)}catch(e){}})}
 return{raw,put,get,set,event,del:k=>B.del&&B.del(k),keys:()=>B.keys?B.keys():[],on:f=>subs.push(f),use:b=>{B=b||local},local}})();

// ==== src/ui/wrong.js
// UI. Wrong machines: each one believes one common beginner mistake. Used to explain wrong answers.
const WMS=[
 {id:'noprec',name:'Left-to-right machine',belief:'The computer works strictly from left to right, so + can run before *.',real:'* and / run before + and -, unless brackets say otherwise.',ex:'print 2 + 3 * 4;'},
 {id:'rassoc',name:'Right-to-left machine',belief:'The computer works from right to left.',real:'Operators of the same kind run left to right. 10 - 4 - 3 means (10 - 4) - 3.',ex:'print 10 - 4 - 3;'},
 {id:'noscope',name:'No-braces machine',belief:'A variable made inside { } still exists after the }.',real:'Variables made inside { } are thrown away at the }.',ex:'var a = 1;\n{\n  var b = 2;\n}\nprint b;'},
 {id:'shared',name:'Shared-names machine',belief:'A parameter is the same variable as a global with the same name.',real:'A parameter is a new variable that belongs to that one call.',ex:'fun f(n) {\n  n = n + 1;\n  return n;\n}\nvar n = 10;\nprint f(5);\nprint n;'},
 {id:'onemore',name:'One-more-time machine',belief:'A loop runs one extra time after its condition becomes false.',real:'A loop stops as soon as its condition is false.',ex:'var n = 0;\nwhile (n < 3) {\n  n = n + 1;\n  print n;\n}'},
 {id:'missnil',name:'Missing-is-nil machine',belief:'Something that does not exist counts as nil.',real:'Using a variable or field that does not exist is an error.',ex:'print nothing;'},
 {id:'miss0',name:'Missing-is-zero machine',belief:'Something that does not exist counts as 0.',real:'Using a variable or field that does not exist is an error.',ex:'print nothing;'},
 {id:'sharedf',name:'Shared-fields machine',belief:'All objects of one class share the same fields.',real:'Each object has its own fields.',ex:'class Animal {}\nvar a = Animal();\nvar b = Animal();\na.name = "Max";\nprint b.name;'},
 {id:'gone',name:'Short-memory machine',belief:'A function\u2019s variables are gone when it ends, even for a function made inside it.',real:'An inner function keeps the variables it uses alive. This is a closure.',ex:'fun outer() {\n  var x = "kept";\n  fun inner() {\n    print x;\n  }\n  return inner;\n}\nouter()();'},
 {id:'div0',name:'Strict-division machine',belief:'Dividing by zero is always an error.',real:'Lox numbers are decimals. 10 / 0 gives inf (infinity).',ex:'print 10 / 0;'},
 {id:'lines',name:'Line-by-line machine',belief:'The computer runs your code line by line and finds a writing mistake only when it gets there.',real:'The compiler reads the whole program first. A writing mistake stops everything before any line runs.',ex:'print "hello";\nprint 1 +;'},
 {id:'join',name:'Guessing machine',belief:'When you add a number and a text, it joins them.',real:'Lox will not add a number and a text. It stops with an error.',ex:'print 1 + "a";'},
 {id:'forget',name:'Forgetful machine',belief:'A function forgets its remembered values between calls.',real:'A closure keeps the same variable from one call to the next.',ex:'fun makeCounter() {\n  var i = 0;\n  fun count() {\n    i = i + 1;\n    return i;\n  }\n  return count;\n}\nvar c = makeCounter();\nprint c();\nprint c();'}];
function onWM(id,prog,heap){const s=WM;WM=id==='lines'?null:id;try{const R=run(compile(prog),undefined,heap);return{out:R.out,err:R.err}}catch(e){
  if(id==='lines'&&e.line>1){try{const R=run(compile(prog.split('\n').slice(0,e.line-1).join('\n')),undefined,heap);return{out:R.out,err:'Line '+e.line+': '+e.message}}catch(e2){}}

const wmStr=r=>r.out.length?r.out.join(', ')+(r.err?' (then an error)':''):(r.err?'Error: '+r.err.replace(/^Line \d+: /,''):'Nothing is printed');

function wmMatch(opt,r){const o=opt.replace(/^It prints /,'').replace(/ and then /g,' then ').trim(),J=a=>[a.join(', '),a.join(' '),a.join(' then ')];

// Which wrong machine (if any) prints exactly this answer, while the real machine prints something else?
function diagnose(prog,opt,heap){const real=onWM(null,prog,heap);for(const m of WMS){const r=onWM(m.id,prog,heap);if(!wmSame(r,real)&&wmMatch(opt,r))return{m,r,real}}return null}
const wmBox=(d,opt)=>`<div class="wmx"><div class="lb">Where ${esc(opt)} comes from</div><p>The <b>${esc(d.m.name)}</b> prints exactly that. It believes: ${esc(d.m.belief)}</p><p><b>The real rule.</b> ${esc(d.m.real)}</p><div class="wm2"><div><span class="dm">Real machine</span><code>${esc(wmStr(d.real))}</code></div><div><span class="dm">${esc(d.m.name)}</span><code>${esc(wmStr(d.r))}</code></div></div></div>`;
// How many wrong quiz answers can a wrong machine explain? Counted live, so the number on the page is always true.
function wmCoverage(){let n=0,e=0;Object.keys(PG).forEach(i=>PG[i].forEach(p=>(p.qs||[]).forEach(Q=>{if(!Q.code)return;Q.opts.forEach((o,k)=>{if(k===Q.a)return;n++;if(diagnose(Q.code,o))e++})})));return{n,e}}
function wmPage(){const c=wmCoverage();return`<h3>Wrong machines</h3><p class="lead">A wrong answer is rarely random. It usually comes from a wrong idea of how the computer works.</p><p class="lead">So we built ${WMS.length} extra machines. Each one is a version of the real engine with one common beginner mistake built in. When you pick a wrong answer in a quiz or a prediction, the page runs the same code on every wrong machine. If one of them prints exactly your answer, it shows you the idea behind your answer and the real rule.</p><p class="lead">Right now, ${c.e} of the ${c.n} wrong answers in the quizzes that come with code are explained this way. The other wrong answers are not explained by any of these machines.</p>

<h3 style="margin-top:22px">Compare the real machine with a wrong one</h3><p class="lead">Write any program, pick a wrong machine, and press Compare.</p>
<textarea id="wmsrc" spellcheck="false" aria-label="Program to compare" style="min-height:140px">${esc(WMS[0].ex)}</textarea>
<div class="seg" id="wmpick" role="group" aria-label="Wrong machine" style="margin:12px 0">${WMS.map((m,k)=>`<button data-k="${k}" aria-pressed="${k===0}">${esc(m.name)}</button>`).join('')}</div>
<div class="ctl"><button class="btn pri" id="wmrun">Compare</button></div><div id="wmout" aria-live="polite"></div>
<p class="dm" style="margin-top:14px">This idea follows research showing that wrong ideas about how programs behave are common among students (Lu and Krishnamurthi, OOPSLA 2024). The wrong machines are our own addition. They are not part of the book.</p>`}
function wmWire(){let k=0;const pick=j=>{k=j;document.querySelectorAll('#wmpick button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.k===j))};
 const go=()=>{const src=rw($('#wmsrc').value,LEX,{}),real=onWM(null,src),r=onWM(WMS[k].id,src),m=WMS[k];
  $('#wmout').innerHTML=`<div class="wm2"><div><span class="dm">Real machine</span><code>${esc(wmStr(real))}</code></div><div><span class="dm">${esc(m.name)}</span><code>${esc(wmStr(r))}</code></div></div><p class="lead" style="margin-top:10px">${wmSame(real,r)?'Both machines print the same here, so this program does not show the mistake.':'They differ. The '+esc(m.name.toLowerCase())+' believes: '+esc(m.belief)}</p>`};

// ==== src/ui/scenes.js
// UI. Scenes: the run told as a short story the learner steps through, instead of hundreds of steps.
// A scene is one step that matters. The steps skipped before it are summed up in one line with real counts.
// A run of SCENE_ALL steps or fewer keeps every step. Longer runs keep: each instruction the first time it runs,
// every print, the first call and return of each function, every phase of the garbage collector, an error and the end.
// A lesson can also name its own scenes (LSCENES[lesson]) with the same selectors pages use (see pickStep).
// Every number in a scene comes from the run, so it is always true. tests/scenes_check.py checks the rules.
const SCENE_ALL=60,SCENE_MAX=60;
const LSCENES={};
function buildScenes(R,own){const L=R.log,n=L.length;if(!n)return[];
 let keys;
 if(own&&own.length){keys=[...new Set(own.map(a=>pickStep(R,a)).filter(k=>k>=0))].sort((a,b)=>a-b);if(keys.at(-1)!==n-1)keys.push(n-1)}
 else if(n<=SCENE_ALL)keys=L.map((_,j)=>j);
 else{const pick=strict=>{const seen=new Set(),called=new Set(),K=[];
   L.forEach((e,j)=>{const c=e.f.code[e.i],id=e.f.name+'#'+e.f.code.length+':'+e.i;let k=false;
    if(!seen.has(id)){seen.add(id);k=true}
    if(c.op==='PRINT'||(e.hp&&e.hp.ph)||j===n-1)k=true;
    if(!strict&&(c.op==='CALL'||c.op==='INVOKE'||c.op==='SUPER_INVOKE'||(c.op==='RETURN'&&e.fr.length>1)))k=true;
    if(strict&&(c.op==='CALL'||c.op==='INVOKE')){const t=L[j+1]&&L[j+1].fr.at(-1);const nm=t&&t.n;if(nm&&!called.has(nm)){called.add(nm);k=true}}
    if(k)K.push(j)});return K};
  keys=pick(false);if(keys.length>SCENE_MAX)keys=pick(true);
  if(keys.length>SCENE_MAX){const must=keys.filter(j=>{const e=L[j];return j===n-1||(e.hp&&e.hp.ph)||e.f.code[e.i].op==='PRINT'}),rest=keys.filter(j=>!must.includes(j)),room=Math.max(0,SCENE_MAX-must.length);
   keys=[...must,...rest.slice(0,room)].sort((a,b)=>a-b)}}

// Is the instruction at i the jump back to a loop's condition? A for loop jumps back twice per trip (to its step,
// then to its condition), so only the jump whose target reaches a condition test (JUMP_IF_FALSE) before another jump counts.
const LB=new WeakMap();
function loopBack(code,i){if(code[i].op!=='LOOP')return false;let m=LB.get(code);if(!m){m={};LB.set(code,m)}if(i in m)return m[i];

function sceneSkip(R,from,to){const k=to-from;if(k<=0)return'';const L=R.log,seg=L.slice(from,to+1),prev=from?L[from-1]:null;
 // counts include the scene's own step, so they match what the learner sees after it
 const loops=seg.filter(e=>loopBack(e.f.code,e.i)).length,calls=seg.filter(e=>/^Call /.test(e.say)).length,
  printed=L[to].o-(prev?prev.o:0),lines=[...new Set(seg.slice(0,-1).map(e=>e.line))].sort((a,b)=>a-b),
  made=L[to].hp?L[to].hp.made-(prev&&prev.hp?prev.hp.made:0):0;
 const bits=[];if(loops)bits.push(`${loops} loop trip${loops>1?'s':''}`);if(calls)bits.push(`${calls} call${calls>1?'s':''}`);
 if(made)bits.push(`${made} new object${made>1?'s':''} in memory`);if(printed)bits.push(`${printed} line${printed>1?'s':''} printed`);

// UI. Lesson cards. A lesson is a list of cards; each card is one small idea and, most of the time, one thing to do.
// Card types (field t) and what makes them done:
//   read     text (+ picture or code)                       done when shown
//   run      press Run or step to the end                    the run reaches its end
//   moment   step to a named moment (at: a pickStep selector) the machine reaches it
//   peek     "what happens next?" at a moment                 an option is picked (options come from the real run)
//   tap      tap an instruction (op) or a line of code (line) the right one is tapped
//   predict  guess the output, then run                       the run reaches its end after a guess
//   quiz     one question                                     an option is picked

// CONTENT. "Be the machine": the learner plays the virtual machine. For each instruction they pick what the pile
// looks like afterwards. Levels are short programs, easiest first. Checked by tests/machine_check.py.
const BTM=[
 {t:'One sum',p:'print 1 + 2;',tip:'CONSTANT puts a value on top. ADD takes two and puts back one.'},
 {t:'Times before plus',p:'print 2 + 3 * 4;',tip:'Watch the 2. It waits at the bottom while 3 * 4 is worked out.'},
 {t:'Brackets',p:'print (2 + 3) * 4;',tip:'Same numbers as before, but ADD now comes first.'},
 {t:'Left to right',p:'print 10 - 4 - 3;',tip:'SUBTRACT takes the top value away from the one below it.'},
 {t:'A variable',p:'var a = 5;\nprint a * 2;',tip:'DEFINE_GLOBAL moves a value from the pile to the shelf. GET_GLOBAL copies it back.'},
 {t:'A decision',p:'var n = 7;\nif (n > 5) print "big";',tip:'JUMP_IF_FALSE only looks at the top value. A separate POP removes it.'},
 {t:'Change a variable',p:'var x = 1;\nx = x + 4;\nprint x;',tip:'SET_GLOBAL copies the top value to the shelf, and leaves it on the pile.'}
];
// What each instruction does to the pile, as a rule the learner applies. (No answers here.)
const BTMR={CONSTANT:(c,K)=>`Put ${S2(K[c.arg])} on top of the pile.`,NIL:()=>'Put nil on top of the pile.',TRUE:()=>'Put true on top of the pile.',FALSE:()=>'Put false on top of the pile.',
 ADD:()=>'Take the top two values off. Put back their sum.',SUBTRACT:()=>'Take the top two values off. Put back: lower one minus top one.',MULTIPLY:()=>'Take the top two values off. Put back their product.',DIVIDE:()=>'Take the top two values off. Put back: lower one divided by top one.',
 NEGATE:()=>'Replace the top value by its negative.',NOT:()=>'Flip the top value: true becomes false, false becomes true.',
 GREATER:()=>'Take the top two values off. Put back true if the lower one is greater, or else false.',LESS:()=>'Take the top two values off. Put back true if the lower one is less, or else false.',EQUAL:()=>'Take the top two values off. Put back true if they are equal, or else false.',
 PRINT:()=>'Take the top value off and show it on the screen.',POP:()=>'Throw away the top value.',
 DEFINE_GLOBAL:c=>`Take the top value off. Store it on the shelf as ${c.nm}.`,GET_GLOBAL:c=>`Copy the value of ${c.nm} from the shelf onto the pile.`,SET_GLOBAL:c=>`Copy the top value into ${c.nm} on the shelf. Leave it on the pile.`,
 JUMP_IF_FALSE:()=>'Look at the top value. If it is false, jump ahead. Do not remove it.',JUMP:()=>'Jump ahead. The pile is not touched.',LOOP:()=>'Jump back. The pile is not touched.',RETURN:()=>'Take the top value off and end the program.'};

  const cand=[s0,s0.slice(0,-1),s0.concat(s1.length?[r]:[]),s0.slice(0,-2),s1.slice(0,-1),s1.length>1?s1.slice(0,-2).concat([s1[s1.length-1],s1[s1.length-2]]):null,s1.length?[r].concat(s1.slice(0,-1)):null,s0.length?s0.concat([top]):null,s1.concat([0]),s1.concat([1])];
